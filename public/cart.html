<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart - Full Address - E-MARTCOM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial;background:#eef6fb;color:#0f172a}
header{background:linear-gradient(90deg,#082f4a,#0a4a7a);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.wrap{max-width:1150px;margin:14px auto;padding:0 12px;display:grid;grid-template-columns:1fr 380px;gap:14px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 12px rgba(10,74,122,.08);border:1px solid #e0f2fe;margin-bottom:12px}
.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.item img{width:60px;height:60px;object-fit:contain;background:#f8fafc;border-radius:8px}
.qty{display:flex;gap:6px;align-items:center;margin-top:6px}.qty button{width:28px;height:28px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;font-weight:900}
input,select,textarea{width:100%;padding:12px;border:2px solid #e0f2fe;border-radius:10px;margin:6px 0;outline:none;font-size:14px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:#0a4a7a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:8px;font-size:14px}
.btn-mpesa{background:#00a651;color:#fff}.btn-card{background:#0a4a7a;color:#fff}.btn-shop{background:#fff;border:2px solid #0a4a7a;color:#0a4a7a}
.method{border:2px solid #e0f2fe;padding:10px;border-radius:12px;margin:6px 0;cursor:pointer;display:flex;justify-content:space-between}.method.active{border-color:#f68b1e;background:#fffbeb}
.small{font-size:11px;color:#64748b}.price{font-weight:900;color:#0a4a7a}
.totalRow{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}.totalRow.grand{font-size:18px;font-weight:900;border-top:2px solid #0a4a7a;margin-top:8px;padding-top:8px}
.addrLabel{font-size:11px;font-weight:800;color:#0a4a7a;margin-top:10px;display:block;text-transform:uppercase}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<a href="index.html" style="color:#fff;text-decoration:none;font-weight:900">← Store</a>
<div style="font-weight:900;margin-left:10px">E-MARTCOM CART - FULL ADDRESS</div>
<div style="flex:1"></div>
<div id="cartCountTop" style="background:#fff;color:#0a4a7a;padding:6px 12px;border-radius:20px;font-weight:900;font-size:12px">0 items</div>
</header>

<div class="wrap"><div id="left"></div><div id="right"></div></div>

<script>
const BASE={china:{ke:12,ug:15,ng:18,us:20},kenya:{ke:1.5,ug:8,ng:15,us:18},usa:{ke:20,ug:22,ng:24,us:2}};
const MM={air:{m:1,t:"✈️ Air 3-7d",d:"Fast"},sea:{m:0.35,t:"🚢 Sea 20-45d -65%",d:"Cheapest"},eparcel:{m:0.65,t:"📦 E-parcel 10-20d",d:"Balanced"},rail:{m:0.55,t:"🚆 Rail 15-25d",d:"Rail"}};
let dest=localStorage.getItem('shipDest')||'ke';
let shipMethod=localStorage.getItem('shipMethod')||'air';
function getCart(){return JSON.parse(localStorage.getItem('cart')||'[]');}
function saveCart(c){localStorage.setItem('cart',JSON.stringify(c));render();}
function toNum(v){let n=parseFloat(v);return isNaN(n)?0:n;}
function baseCost(o,d,w,m){let b=(BASE[o]||BASE.china)[d]||20;let wm=w<=0.5?1:w<=1?1.5:2.2;return b*wm*MM[m].m;}
function setDest(d){dest=d;localStorage.setItem('shipDest',d);render();}
function setAllMethod(m){shipMethod=m;localStorage.setItem('shipMethod',m);let c=getCart();c.forEach(i=>i.shipMethod=m);saveCart(c);}
function changeQty(i,d){let c=getCart();c[i].qty=toNum(c[i].qty)+d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
function removeItem(i){let c=getCart();c.splice(i,1);saveCart(c);}

function render(){
let cart=getCart();
document.getElementById('cartCountTop').innerText=cart.reduce((s,i)=>s+toNum(i.qty),0)+' items';
if(cart.length==0){document.getElementById('left').innerHTML=`<div class="card" style="text-align:center;padding:40px"><h3>🛒 Empty</h3><button class="btn btn-shop" onclick="location.href='index.html'">Shop</button></div>`;document.getElementById('right').innerHTML='';return;}
let subProd=0,subShip=0;
cart.forEach(it=>{let o=it.source||it.o||'china';let w=toNum(it.weight||0.2);let m=it.shipMethod||shipMethod;let sc=baseCost(o,dest,w,m);it.shipCost=sc;it.calcShip=sc*toNum(it.qty);subProd+=toNum(it.price)*toNum(it.qty);subShip+=it.calcShip;});
let fee=subProd*0.03;let grand=subProd+subShip+fee;let grandKsh=Math.floor(grand*130);

let leftHtml=`<div class="card"><h3>🛒 Cart (${cart.length})</h3>
<div class="row"><div><label class="small" style="font-weight:800">SHIP TO COUNTRY:</label><select onchange="setDest(this.value)"><option value="ke" ${dest=='ke'?'selected':''}>Kenya</option><option value="ug" ${dest=='ug'?'selected':''}>Uganda</option><option value="ng" ${dest=='ng'?'selected':''}>Nigeria</option><option value="us" ${dest=='us'?'selected':''}>USA</option></select></div><div><label class="small" style="font-weight:800">METHOD:</label><div style="font-size:11px;background:#fffbeb;padding:8px;border-radius:8px;border:1px solid #fef3c7">${MM[shipMethod].t} ✅</div></div></div>
${Object.keys(MM).map(m=>`<div class="method ${m==shipMethod?'active':''}" onclick="setAllMethod('${m}')"><div><b>${MM[m].t}</b><br><span class="small">${MM[m].d}</span></div><div>${m==shipMethod?'✅':''}</div></div>`).join('')}
</div><div class="card">${cart.map((it,idx)=>`<div class="item"><img src="${it.image||it.img}"><div style="flex:1"><b style="font-size:12px">${it.name}</b><br><span class="small">${(it.source||'china').toUpperCase()}→${dest.toUpperCase()} $${it.shipCost.toFixed(2)} ship + $${toNum(it.price).toFixed(2)} prod</span><br><span class="price">$${((toNum(it.price)+it.shipCost)*toNum(it.qty)).toFixed(2)}</span><div class="qty"><button onclick="changeQty(${idx},-1)">-</button><span style="font-weight:800;min-width:20px;text-align:center">${toNum(it.qty)}</span><button onclick="changeQty(${idx},1)">+</button><button onclick="removeItem(${idx})" style="margin-left:10px;background:#fee2e2">✕</button></div></div></div>`).join('')}</div>`;

document.getElementById('left').innerHTML=leftHtml;

let rightHtml=`<div class="card"><h3 style="color:#0a4a7a">📦 Summary</h3><div class="totalRow"><span>Products</span><span>$${subProd.toFixed(2)}</span></div><div class="totalRow"><span>Shipping ${shipMethod.toUpperCase()}</span><span>$${subShip.toFixed(2)}</span></div><div class="totalRow"><span>Fee 3%</span><span>$${fee.toFixed(2)}</span></div><div class="totalRow grand"><span>Total KSh</span><span>KSh ${grandKsh.toLocaleString()}</span></div></div>

<div class="card" style="border:2px solid #0a4a7a">
<h3>👤 Full Delivery Address - For DIRECT Dropship</h3>
<p class="small" style="background:#fffbeb;padding:8px;border-radius:8px;margin:8px 0">⚠️ Supplier will ship DIRECT to this address. Enter full, correct details!</p>

<label class="addrLabel">Customer Full Name *</label>
<input id="customerName" placeholder="e.g. TONY KIMANI" autocomplete="name">

<label class="addrLabel">Phone Number * (M-Pesa + Delivery)</label>
<input id="customerPhone" placeholder="e.g. 0713367205 or 254713367205" type="tel" autocomplete="tel">

<div class="row">
<div><label class="addrLabel">County / Region *</label><select id="county"><option value="">Select County</option><option>Nairobi</option><option>Mombasa</option><option>Kisumu</option><option>Nakuru</option><option>Uasin Gishu</option><option>Trans Nzoia</option><option>Kitale</option><option>Kiambu</option><option>Machakos</option><option>Kakamega</option><option>Other</option></select></div>
<div><label class="addrLabel">Town / City *</label><input id="town" placeholder="e.g. Kitale Town, CBD, Westlands"></div>
</div>

<label class="addrLabel">Estate / Street / Area *</label>
<input id="estate" placeholder="e.g. Moi Avenue, Milimani Estate, CBD, Kenyatta Street">

<div class="row">
<div><label class="addrLabel">Building / Apartment / House *</label><input id="building" placeholder="e.g. Sky Mall 2nd Floor, House No 12, Stall 45"></div>
<div><label class="addrLabel">Nearest Landmark (Optional)</label><input id="landmark" placeholder="e.g. Near Equity Bank, Opposite Naivas"></div>
</div>

<label class="addrLabel">Additional Notes for Rider (Optional)</label>
<textarea id="notes" rows="2" placeholder="e.g. Call when at gate, Leave at reception, Second floor..."></textarea>

<div id="formError" style="color:#ef4444;font-size:12px;margin:8px 0;display:none;background:#fee2e2;padding:8px;border-radius:8px"></div>

<div style="background:#ecfeff;padding:10px;border-radius:10px;margin-top:10px">
<div style="font-size:11px;font-weight:800;color:#0a4a7a">📍 PREVIEW FOR SUPPLIER (Direct Delivery):</div>
<div id="addrPreview" style="font-size:11px;margin-top:4px;color:#334155">Fill form to see preview...</div>
</div>

<button class="btn btn-mpesa" onclick="payMpesa()">📱 Pay KSh ${grandKsh.toLocaleString()} M-Pesa</button>
<button class="btn btn-card" onclick="payCard()">💳 Pay KSh ${grandKsh.toLocaleString()} Card</button>
</div>`;

document.getElementById('right').innerHTML=rightHtml;

// live preview
['customerName','customerPhone','county','town','estate','building','landmark','notes'].forEach(id=>{
let el=document.getElementById(id);
if(el)el.addEventListener('input',updatePreview);
if(el)el.addEventListener('change',updatePreview);
});
function updatePreview(){
let name=document.getElementById('customerName')?.value||'';
let phone=document.getElementById('customerPhone')?.value||'';
let county=document.getElementById('county')?.value||'';
let town=document.getElementById('town')?.value||'';
let estate=document.getElementById('estate')?.value||'';
let building=document.getElementById('building')?.value||'';
let landmark=document.getElementById('landmark')?.value||'';
let notes=document.getElementById('notes')?.value||'';
let full=`${name}, ${phone}, ${building}, ${estate}, ${town}, ${county}${landmark? ', Near '+landmark:''}${notes? ' - '+notes:''}`;
document.getElementById('addrPreview').innerText=full.replace(/^,|,$/g,'').trim()||'Fill form...';
}
updatePreview();
}

function validateFull(){
let name=document.getElementById('customerName').value.trim();
let phone=document.getElementById('customerPhone').value.trim();
let county=document.getElementById('county').value.trim();
let town=document.getElementById('town').value.trim();
let estate=document.getElementById('estate').value.trim();
let building=document.getElementById('building').value.trim();
let landmark=document.getElementById('landmark').value.trim();
let notes=document.getElementById('notes').value.trim();
let err=document.getElementById('formError');
err.style.display='none';
if(name.length<3 || /^\d+$/.test(name)){err.innerText='❌ Enter REAL full name, not numbers. Example: TONY KIMANI';err.style.display='block';return null;}
let clean=phone.replace(/\D/g,'');
if(clean.length<9){err.innerText='❌ Enter valid phone 07... or 2547... - Need for M-Pesa + delivery';err.style.display='block';return null;}
if(!county){err.innerText='❌ Select County / Region - e.g. Nairobi, Trans Nzoia';err.style.display='block';return null;}
if(town.length<2){err.innerText='❌ Enter Town / City - e.g. Kitale, Nairobi CBD';err.style.display='block';return null;}
if(estate.length<3){err.innerText='❌ Enter Estate / Street / Area - e.g. Milimani, Moi Avenue';err.style.display='block';return null;}
if(building.length<2){err.innerText='❌ Enter Building / House Number - e.g. House No 12, Stall 45, Sky Mall';err.style.display='block';return null;}
let realPhone=clean;
if(realPhone.startsWith('0'))realPhone='254'+realPhone.slice(1);
if(realPhone.startsWith('7'))realPhone='254'+realPhone;
let fullAddress=`${building}, ${estate}, ${town}, ${county}${landmark? ', Near '+landmark:''}${notes? '. Note: '+notes:''}`;
return {name,phone:realPhone,address:fullAddress,details:{county,town,estate,building,landmark,notes}};
}

async function payCard(){
let v=validateFull();if(!v)return;
let cart=getCart();let sub=0,ship=0;cart.forEach(it=>{sub+=toNum(it.price)*toNum(it.qty);ship+=toNum(it.shipCost)*toNum(it.qty);});
let grand=sub+ship+sub*0.03;let ksh=Math.floor(grand*130);
let btn=event.target;btn.innerText='⏳ Processing...';btn.disabled=true;
try{let r=await fetch('/api/card-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:ksh,items:cart,customerName:v.name,phone:v.phone,actualPhone:v.phone,address:v.address,addressDetails:v.details})});let j=await r.json();if(j.success){localStorage.removeItem('cart');alert(`✅ PAID KSh ${ksh.toLocaleString()}\nName: ${v.name}\nPhone: ${v.phone}\nAddress: ${v.address}\nReceipt: ${j.order.receipt}\n\n🚀 Supplier will ship DIRECT to:\n${v.address}`);location.href='admin.html';}else{alert(JSON.stringify(j));btn.disabled=false;btn.innerText=`💳 Pay KSh ${ksh.toLocaleString()} Card`;}}catch(e){alert(e.message);btn.disabled=false;}}
async function payMpesa(){
let v=validateFull();if(!v)return;
let cart=getCart();let sub=0,ship=0;cart.forEach(it=>{sub+=toNum(it.price)*toNum(it.qty);ship+=toNum(it.shipCost)*toNum(it.qty);});
let grand=sub+ship+sub*0.03;let ksh=Math.floor(grand*130);
let btn=event.target;btn.innerText='⏳ STK Sending...';btn.disabled=true;
try{let r=await fetch('/api/mpesa/stk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:v.phone,amount:ksh,items:cart,customerName:v.name,address:v.address,addressDetails:v.details})});let j=await r.json();if(j.success||j.data){alert(`📱 STK Sent to ${v.phone} KSh ${ksh.toLocaleString()}\nAddress: ${v.address}\n\nTell customer to enter PIN!\nAfter PAID → Admin → DIRECT SHIP`);}btn.innerText=`📱 Pay KSh ${ksh.toLocaleString()} M-Pesa`;btn.disabled=false;}catch(e){alert(e.message);btn.disabled=false;}
}
render();
</script>
</body>
</html>
