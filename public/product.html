<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product Variations</title>
<style>body{font-family:Arial;background:#fff;margin:0}header{background:#0a4a7a;padding:12px;color:#fff;display:flex;gap:10px;position:sticky;top:0;z-index:20}.wrap{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{border:1px solid #eee;border-radius:10px;padding:12px}.var{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid #eee}.var img{width:50px;height:50px;object-fit:contain}.qty{display:flex;align-items:center;gap:6px;margin-left:auto}.qty button{width:28px;height:28px;border:1px solid #ddd;border-radius:20px;background:#fff;cursor:pointer}.totalBox{background:#f8fafc;padding:12px;border-radius:10px;border:2px solid #0a4a7a;margin-top:10px}.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;cursor:pointer;margin-top:8px}.btn-cart{background:#fff;border:2px solid #0a4a7a;color:#0a4a7a}.btn-order{background:#f68b1e;color:#fff}@media(max-width:800px){.wrap{grid-template-columns:1fr}}</style></head><body>
<header><a href="index.html" style="color:#fff;text-decoration:none;font-weight:900">← Back</a><div style="flex:1"></div><a href="cart.html" style="background:#fff;color:#0a4a7a;padding:6px 12px;border-radius:20px;text-decoration:none;font-weight:900">🛒 Cart</a></header>
<div class="wrap"><div id="left"></div><div id="right"></div></div>
<script>
const BASE={china:{ke:12,ug:15,ng:18,us:20,ae:16,gb:20},kenya:{ke:1.5,ug:8,ng:15,us:18,ae:15,gb:18},usa:{ke:20,ug:22,ng:24,us:2,ae:16,gb:14},japan:{ke:26,ug:28,ng:30,us:22,ae:18,gb:16},uk:{ke:18,ug:20,ng:22,us:14,ae:12,gb:2},uae:{ke:12,ug:14,ng:16,us:16,ae:2,gb:12}};
const MM={air:{m:1,t:"Air 3-7d"},sea:{m:0.35,t:"Sea 20-45d -65% CHEAP"},eparcel:{m:0.65,t:"E-parcel 10-20d"},rail:{m:0.55,t:"Rail 15-25d"}};
let all=[{id:1,n:"Clover Bracelet 18K Gold 6 Variations",p:1.87,old:3.2,w:0.05,o:["china","kenya"],img:"https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=400",vars:["Gold-purple_LZ0692","Gold-red-LZ0692","Gold-pink-LZ0692","Gold-blue-LZ0692","Gold-orange-LZ0692","Gold-green-LZ0692"]}];
let pid=new URLSearchParams(location.search).get('id')||1;let pr=all.find(x=>x.id==pid)||all[0];
let dest=localStorage.getItem('shipDest')||'ke';let method=localStorage.getItem('shipMethod')||'air';let origin=pr.o[0];
let qtys={};pr.vars?.forEach(v=>qtys[v]=0);
function base(o,d,w){let b=BASE[o]?.[d]||20;return b*(w<=0.5?1:1.5)*MM[method].m;}
function render(){
let subQty=Object.values(qtys).reduce((s,q)=>s+q,0);let subProd=subQty*pr.p;let shipOne=base(origin,dest,pr.w);let shipTotal=shipOne*subQty;let fee=subProd*0.03;let grand=subProd+shipTotal+fee;
document.getElementById('left').innerHTML=`<div class="card"><img src="${pr.img}" style="width:100%;height:300px;object-fit:contain"><h3>${pr.n}</h3><p>Weight ${pr.w}kg per piece • Origins: ${pr.o.join(', ')}</p>
<div style="margin-top:10px">Ship To: <select onchange="dest=this.value;localStorage.setItem('shipDest',dest);render()"><option value="ke" ${dest=='ke'?'selected':''}>Kenya</option><option value="ug" ${dest=='ug'?'selected':''}>Uganda</option><option value="ng" ${dest=='ng'?'selected':''}>Nigeria</option><option value="us" ${dest=='us'?'selected':''}>USA</option><option value="ae" ${dest=='ae'?'selected':''}>UAE</option></select></div>
<div style="margin-top:8px">${pr.o.map(o=>`<div style="border:2px solid ${o==origin?'#0a4a7a':'#eee'};padding:8px;border-radius:8px;margin:4px 0;cursor:pointer" onclick="origin='${o}';render()">${o.toUpperCase()} - Ship $${base(o,dest,pr.w).toFixed(2)} per pc ${o==origin?'✅':''}</div>`).join('')}</div>
<div style="margin-top:8px">${Object.keys(MM).map(m=>`<div style="border:2px solid ${m==method?'#f68b1e':'#eee'};padding:8px;border-radius:8px;margin:4px 0;cursor:pointer" onclick="method='${m}';localStorage.setItem('shipMethod',m);render()">${MM[m].t} - Ship $${(BASE[origin]?.[dest]||20)*(pr.w<=0.5?1:1.5)*MM[m].m} per pc = Grand $${(pr.p+(BASE[origin]?.[dest]||20)*(pr.w<=0.5?1:1.5)*MM[m].m).toFixed(2)} INCL ${m==method?'✅':''}</div>`).join('')}</div></div>`;
let varsHtml=`<div class="card"><h3>Select variations and quantity</h3><div style="font-size:12px;color:#666">Like Alibaba: choose qty per color</div>${(pr.vars||["Default"]).map(v=>`<div class="var"><img src="${pr.img}"><div><b style="font-size:12px">${v}</b><br><small>Ksh ${(pr.p*129).toFixed(0)} /piece • $${pr.p}</small></div><div class="qty"><button onclick="qtys['${v}']=Math.max(0,qtys['${v}']-1);render()">-</button><span style="min-width:20px;text-align:center;font-weight:800">${qtys[v]||0}</span><button onclick="qtys['${v}']++;render()">+</button></div></div>`).join('')}
<div class="totalBox">
<div style="display:flex;justify-content:space-between"><span>Subtotal (${subQty} pieces)</span><span>Ksh ${(subProd*129).toFixed(2)} ($${subProd.toFixed(2)})</span></div>
<div style="display:flex;justify-content:space-between"><span>Item subtotal</span><span>$${subProd.toFixed(2)}</span></div>
<div style="display:flex;justify-content:space-between;color:#0a4a7a"><span>Shipping fee ${origin.toUpperCase()}→${dest.toUpperCase()} ${method.toUpperCase()} (${subQty} x $${shipOne.toFixed(2)})</span><span>$${shipTotal.toFixed(2)}</span></div>
<div style="display:flex;justify-content:space-between"><span>Payment processing fee 3%</span><span>$${fee.toFixed(2)}</span></div>
<div style="display:flex;justify-content:space-between;font-weight:900;font-size:18px;border-top:2px solid #0a4a7a;margin-top:8px;padding-top:8px"><span>Pay in USD (Grand Inclusive)</span><span>$${grand.toFixed(2)}</span></div>
<div style="font-size:10px;color:#666">KES ${(grand*129).toFixed(2)} (1 KES = 0.0077 USD) • ${method.toUpperCase()} ${MM[method].t}</div>
<div style="font-size:10px;margin-top:6px">Product $${subProd.toFixed(2)} + Shipping $${shipTotal.toFixed(2)} + Fee $${fee.toFixed(2)} = <b>$${grand.toFixed(2)} INCLUSIVE</b></div>
</div>
<button class="btn btn-cart" onclick="addToCart()">Add to cart - $${grand.toFixed(2)} INCLUSIVE (${subQty} pcs)</button>
<button class="btn btn-order" onclick="addToCart();location.href='cart.html'">Start order - $${grand.toFixed(2)}</button>
</div>`;
document.getElementById('right').innerHTML=varsHtml;
}
function addToCart(){let totalQty=Object.values(qtys).reduce((s,q)=>s+q,0);if(totalQty==0){alert('Select at least 1 variation');return;}let cart=JSON.parse(localStorage.getItem('cart')||'[]');Object.keys(qtys).forEach(v=>{if(qtys[v]>0){let ship=base(origin,dest,pr.w);cart.push({id:pr.id+'_'+v,name:pr.n+' '+v,price:pr.p,priceUSD:pr.p,qty:qtys[v],weight:pr.w,source:origin,shipMethod:method,dest,shipCost:ship,variation:v,image:pr.img});}});localStorage.setItem('cart',JSON.stringify(cart));alert(`Added ${totalQty} pcs\nItem subtotal $${(totalQty*pr.p).toFixed(2)}\nShipping $${(base(origin,dest,pr.w)*totalQty).toFixed(2)} ${method.toUpperCase()}\nGrand Inclusive $${(totalQty*pr.p + base(origin,dest,pr.w)*totalQty + totalQty*pr.p*0.03).toFixed(2)}\nThis is what you pay in cart`);}
render();
</script></body></html>
