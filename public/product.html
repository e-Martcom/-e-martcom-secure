<div style="margin-top:10px"><b style="font-size:11px">🚚 CHOOSE METHOD (shows inclusive):</b><div>${methodsHtml}</div></div>
<div style="margin-top:10px;padding:10px;background:#ecfeff;border-radius:8px;border:2px solid #0a4a7a">
<div style="display:flex;justify-content:space-between;font-size:12px"><span>Product Price x<span id="qtyLabel">${qty}</span></span><span>${format(p.price)} x${qty} = ${format(p.price*qty)}</span></div>
<div style="display:flex;justify-content:space-between;font-size:12px;color:#0a4a7a;font-weight:700"><span>Shipping ${selectedOrigin.toUpperCase()}→${dest.toUpperCase()} ${selectedMethod.toUpperCase()} x${qty}</span><span>${format(totalShip)} x${qty} = ${format(shipQty)}</span></div>
<div style="display:flex;justify-content:space-between;font-weight:900;font-size:16px;border-top:2px solid #0a4a7a;margin-top:6px;padding-top:6px"><span>Grand Total INCLUSIVE</span><span style="color:#0a4a7a">${format(grandQty)}</span></div>
<small style="font-size:10px;color:#64748b">Mode: ${MM[selectedMethod].icon} ${selectedMethod.toUpperCase()} - ${MM[selectedMethod].t} • Total weight ${p.weight*qty}kg</small>
</div>
<div style="display:flex;gap:8px;margin-top:10px"><input id="qty" type="number" value="${qty}" min="1" onchange="load()" style="width:70px;padding:10px;border:2px solid #e0f2fe;border-radius:8px"><span style="font-size:11px;color:#64748b">(${p.weight}kg each)</span></div>
<button class="btn btn-cart" onclick="addCart()">🛒 ADD TO CART - ${format(grandQty)} INCLUSIVE</button>
<button class="btn btn-buy" onclick="buyNow()">⚡ BUY NOW - ${format(grandQty)} INCLUSIVE</button>
</div>
<div><div class="card"><h4 style="font-size:12px">🌍 Route</h4><p style="font-size:11px;margin-top:6px;line-height:1.5">
From: <b>${ORIGIN_LABEL[selectedOrigin]}</b><br>To: <b>${dest.toUpperCase()}</b><br>Method: <b>${MM[selectedMethod].icon} ${selectedMethod.toUpperCase()}</b><br>Weight: ${p.weight}kg x${qty}<br><br>Ship: ${format(shipQty)}<br>Product: ${format(p.price*qty)}<br><b>Grand: ${format(grandQty)} INCLUSIVE</b><br><br>Currency: <select onchange="cur=this.value;localStorage.setItem('userCurrency',cur);load()" style="padding:6px;border-radius:6px"><option ${cur=='USD'?'selected':''} value="USD">USD</option><option ${cur=='UGX'?'selected':''} value="UGX">UGX</option><option ${cur=='NGN'?'selected':''} value="NGN">NGN</option><option ${cur=='KES'?'selected':''} value="KES">KES</option><option ${cur=='GBP'?'selected':''} value="GBP">GBP</option><option ${cur=='EUR'?'selected':''} value="EUR">EUR</option></select></p></div></div>
`;
let rel=allProducts.filter(x=>x.id!=p.id && x.origins.some(o=>p.origins.includes(o))).slice(0,6);
document.getElementById('relGrid').innerHTML=rel.map(r=>{let c=base(r.origins[0],dest,r.weight)*MM[selectedMethod].m;return `<div onclick="location.href='/product.html?id=${r.id}'" style="border:1px solid #eee;border-radius:8px;padding:6px;cursor:pointer"><img src="${r.img}" style="width:100%;height:70px;object-fit:contain"><div style="font-size:10px;font-weight:700">${r.name.slice(0,22)}</div><div style="font-size:10px;color:#0a4a7a;font-weight:900">${format(r.price+c)} INCL</div><div style="font-size:8px">${r.origins.map(o=>o.toUpperCase()).join(', ')}</div></div>`}).join('');
}
function addCart(){
 let cart=JSON.parse(localStorage.getItem('cart')||'[]');
 let qty=parseInt(document.getElementById('qty').value)||1;
 let shipOne=base(selectedOrigin,dest,p.weight)*MM[selectedMethod].m;
 let grandOne=p.price+shipOne;
 let grandQty=grandOne*qty;
 let shipQty=shipOne*qty;
 let prodQty=p.price*qty;
 let ex=cart.find(x=>x.id==p.id && x.source==selectedOrigin && x.shipMethod==selectedMethod && x.dest==dest);
 if(ex){ex.qty+=qty}else{cart.push({id:p.id,name:p.name,price:p.price,priceUSD:p.price,brand:p.brand,image:p.img,img:p.img,qty,weight:p.weight,source:selectedOrigin,shipMethod:selectedMethod,dest,shipCost:shipOne,grandPerItem:grandOne});}
 localStorage.setItem('cart',JSON.stringify(cart));
 localStorage.setItem('shipDest',dest);
 localStorage.setItem('shipMethod',selectedMethod);
 localStorage.setItem('userCurrency',cur);
 document.getElementById('cartCount').innerText=cart.reduce((s,i)=>s+i.qty,0);
 document.getElementById('cartTotal').innerText=format(calcCartTotal());
 alert(`✅ ADDED - GRAND TOTAL INCLUSIVE\n\n${p.name}\nFrom: ${selectedOrigin.toUpperCase()} → ${dest.toUpperCase()}\nMode: ${selectedMethod.toUpperCase()} ${MM[selectedMethod].t}\nQty: ${qty}\n\nProduct: ${format(p.price)} x${qty} = ${format(prodQty)}\nShipping: ${format(shipOne)} x${qty} = ${format(shipQty)}\n------------------------------\nGRAND TOTAL INCLUSIVE: ${format(grandQty)}\n\nThis is what you will pay in cart.`);
}
function buyNow(){addCart();location.href='/cart.html';}
async function init(){try{let ip=await fetch('https://ipapi.co/json/').then(r=>r.json());let map={KE:'ke',UG:'ug',NG:'ng',GH:'gh',ZA:'za',US:'us',CA:'ca',JP:'jp',GB:'gb',DE:'de',AE:'ae'};if(map[ip.country_code]&&!localStorage.getItem('shipDest'))dest=map[ip.country_code];let mapC={UG:'UGX',NG:'NGN',KE:'KES',GH:'GHS',ZA:'ZAR',GB:'GBP',DE:'EUR',US:'USD',CA:'CAD',JP:'JPY',AE:'AED'};if(!localStorage.getItem('userCurrency'))cur=mapC[ip.country_code]||'USD';let d=await fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json());rates=d.rates;document.getElementById('geo').innerText=`📍 ${ip.country_name} • ${cur} → ${dest.toUpperCase()}`;}catch{}load();}
init();
</script></body></html>
