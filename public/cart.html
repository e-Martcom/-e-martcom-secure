<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart - Global Ship - Any to Any</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial;background:#f5f5f5}header{background:linear-gradient(90deg,#0a4a7a,#0e7490);padding:12px 16px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:20}.logo{font-weight:900;color:#fff;font-size:22px}.wrap{max-width:1350px;margin:14px auto;padding:0 10px;display:grid;grid-template-columns:1fr 400px;gap:12px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.item{display:flex;gap:8px;padding:8px;border:1px solid #eef2f7;border-radius:10px;margin-bottom:6px}.ship-option{border:2px solid #e0f2fe;border-radius:10px;padding:8px;margin:4px 0;cursor:pointer;font-size:11px;display:flex;justify-content:space-between}.ship-option.active{border-color:#0a4a7a;background:#ecfeff}select,input{width:100%;padding:10px;border:2px solid #e0f2fe;border-radius:8px;margin:4px 0}.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;cursor:pointer}.btn-pay{background:#ffc439}.summary-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}.total{font-weight:900;font-size:18px;border-top:2px solid #eee;padding-top:8px;color:#0a4a7a}@media(max-width:900px){.wrap{grid-template-columns:1fr}}</style></head><body>
<header><div class="logo" onclick="location.href='/'">E-MART<span style="color:#06b6d4">COM</span> GLOBAL SHIP</div><div style="flex:1"></div><div id="geo" style="color:#fff;font-size:11px;font-weight:800">Any → Any</div><a href="/" style="color:#fff;text-decoration:none;font-weight:800">← Shop</a></header>
<div class="wrap"><div class="card"><h3>🛒 Cart (<span id="cnt">0</span>) - Global Shipping</h3><div id="list"></div></div>
<div><div class="card">
<h4>🌍 SHIPPING CALCULATOR - Any Country to Any Country</h4>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<div><label style="font-size:10px;font-weight:900">SHIP FROM (Origin)</label><select id="origin" onchange="calcShip()"><option value="china">China (Alibaba)</option><option value="kenya">Kenya (Nanyuki)</option><option value="canada">Canada</option><option value="japan">Japan</option><option value="usa">USA</option><option value="germany">Germany/EU</option><option value="uk">UK</option><option value="uae">UAE/Dubai</option><option value="turkey">Turkey</option></select></div>
<div><label style="font-size:10px;font-weight:900">SHIP TO (Destination)</label><select id="dest" onchange="calcShip()"><option value="ke">Kenya</option><option value="ug">Uganda</option><option value="ng">Nigeria</option><option value="gh">Ghana</option><option value="za">South Africa</option><option value="us">USA</option><option value="ca">Canada</option><option value="jp">Japan</option><option value="gb">UK</option><option value="de">Germany</option><option value="ae">UAE</option></select></div>
</div>
<input id="addr" placeholder="Full address for quote" oninput="calcShip()">
<div style="margin:8px 0"><b style="font-size:11px">Choose Shipping Method:</b>
<div id="methods"></div>
</div>
<div class="summary-row"><span>Products</span><span id="sub">$0</span></div>
<div class="summary-row"><span>Weight</span><span id="wt">0kg</span></div>
<div class="summary-row"><span>Route</span><span id="route" style="font-size:10px">-</span></div>
<div class="summary-row"><span>Shipping (<span id="methodName">Air</span>)</span><span id="shipC">$0</span></div>
<div class="summary-row total"><span>Grand Total</span><span id="grand">$0</span></div>
<button class="btn btn-pay" onclick="checkout()">PAY WITH PAYPAL/CARD - <span id="grand2">$0</span></button>
<div id="breakdown" style="font-size:10px;color:#334155;margin-top:8px;line-height:1.4"></div>
</div></div></div>
<script>
// BASE AIR COST for 0.5kg USD - Matrix Origin -> Dest
const BASE_AIR = {
  china:{ke:12,ug:15,tz:14,ng:18,gh:18,za:18,us:20,ca:20,jp:14,gb:20,de:20,ae:16},
  kenya:{ke:1.5,ug:8,tz:7,ng:15,gh:15,za:15,us:18,ca:22,jp:24,gb:18,de:18,ae:15},
  canada:{ke:24,ug:26,ng:28,gh:28,za:26,us:12,ca:2,jp:18,gb:14,de:15,ae:20},
  japan:{ke:26,ug:28,ng:30,gh:30,za:28,us:22,ca:18,jp:2,gb:16,de:16,ae:18},
  usa:{ke:20,ug:22,ng:24,gh:24,za:22,us:2,ca:12,jp:22,gb:14,de:14,ae:16},
  germany:{ke:18,ug:20,ng:22,gh:22,za:20,us:14,ca:15,jp:16,gb:6,de:2,ae:12},
  uk:{ke:18,ug:20,ng:22,gh:22,za:20,us:14,ca:14,jp:16,gb:2,de:6,ae:12},
  uae:{ke:12,ug:14,ng:16,gh:16,za:14,us:16,ca:20,jp:18,gb:12,de:12,ae:2},
  turkey:{ke:14,ug:16,ng:18,gh:18,za:16,us:15,ca:16,jp:17,gb:8,de:7,ae:6}
};
const METHOD_MULTIPLIER = {air:1.0, eparcel:0.65, sea:0.35, rail:0.55};
const METHOD_TIME = {air:"3-7 days", eparcel:"10-20 days", sea:"20-45 days", rail:"15-25 days"};
const WEIGHT_MULT = {0.5:1, 1:1.5, 2:2.2, 5:3.8, 10:6.5};

let cart=JSON.parse(localStorage.getItem('cart')||'[]').map(i=>({weight:i.weight||0.5, source:i.source||'china', priceUSD:i.priceUSD||i.price,...i}));
let rates={USD:1}, cur=localStorage.getItem('userCurrency')||'USD', selectedMethod='air';

function format(usd){let r=rates[cur]||1;let c=usd*r;if(cur=='UGX')return `UGX ${Math.round(c).toLocaleString()}`;if(cur=='NGN')return `₦${Math.round(c).toLocaleString()}`;if(cur=='KES')return `KSh ${Math.round(c).toLocaleString()}`;return `$${c.toFixed(2)}`;}
function getBase(origin,dest,weight){let base=BASE_AIR[origin]?.[dest]||20;let wMult=weight<=0.5?1:weight<=1?1.5:weight<=2?2.2:weight<=5?3.8:6.5;return base*wMult;}

function renderCart(){let h='',sub=0,w=0;cart.forEach((it,i)=>{sub+=it.priceUSD*it.qty;w+=it.weight*it.qty;h+=`<div class="item"><img src="${it.image||it.img}" style="width:50px;height:50px;object-fit:cover;border-radius:6px"><div style="flex:1"><b style="font-size:12px">${it.name.slice(0,30)}</b><br><small style="font-size:10px">Src:${it.source} ${it.weight}kg x${it.qty} • ${format(it.priceUSD)}</small></div><b style="font-size:12px">${format(it.priceUSD*it.qty)}</b></div>`;});document.getElementById('list').innerHTML=h||'Empty';document.getElementById('cnt').innerText=cart.reduce((s,i)=>s+i.qty,0);document.getElementById('sub').innerText=format(sub);document.getElementById('wt').innerText=w.toFixed(1)+'kg';calcShip();}

function calcShip(){
let origin=document.getElementById('origin').value;
let dest=document.getElementById('dest').value;
let totalW=cart.reduce((s,i)=>s+i.weight*i.qty,0)||0.5;
let sub=cart.reduce((s,i)=>s+i.priceUSD*i.qty,0);
let base=getBase(origin,dest,totalW);
document.getElementById('route').innerText=`${origin.toUpperCase()} → ${dest.toUpperCase()} ${totalW.toFixed(1)}kg`;

// render methods
let methodsHtml='';
Object.keys(METHOD_MULTIPLIER).forEach(m=>{
  let cost=base*METHOD_MULTIPLIER[m];
  let available=true;
  if(m=='rail' && (['ca','us','ng','gh','za','ke','ug'].includes(dest) && origin!='china' && origin!='germany' && origin!='turkey')) available=false;
  if(m=='sea' && totalW<0.5) cost+=2;
  let label=`${m.toUpperCase()} - ${METHOD_TIME[m]} - ${format(cost)}`;
  methodsHtml+=`<div class="ship-option ${selectedMethod==m?'active':''} ${!available?'':' '}" onclick="selectedMethod='${m}';calcShip()" style="${!available?'opacity:0.4;pointer-events:none':''}"><span>✈️ ${label}</span><span>${!available?'N/A':''}</span></div>`;
});
document.getElementById('methods').innerHTML=methodsHtml;

let shipCost=base*METHOD_MULTIPLIER[selectedMethod];
document.getElementById('shipC').innerText=format(shipCost);
document.getElementById('methodName').innerText=selectedMethod.toUpperCase();
document.getElementById('grand').innerText=format(sub+shipCost);
document.getElementById('grand2').innerText=format(sub+shipCost);
document.getElementById('breakdown').innerHTML=`Route: ${origin} → ${dest}<br>Air base 0.5kg: $${BASE_AIR[origin]?.[dest]||20} → weight ${totalW}kg = $${base.toFixed(2)} → ${selectedMethod} x${METHOD_MULTIPLIER[selectedMethod]} = <b>${format(shipCost)}</b><br>Example: Canada→Nigeria Air ${format(BASE_AIR.canada.ng||28)} Sea ${format(BASE_AIR.canada.ng*0.35)}`;
}

async function init(){try{let ip=await fetch('https://ipapi.co/json/').then(r=>r.json());let map={KE:'ke',UG:'ug',NG:'ng',GH:'gh',ZA:'za',US:'us',CA:'ca',JP:'jp',GB:'gb',DE:'de',AE:'ae'};if(map[ip.country_code])document.getElementById('dest').value=map[ip.country_code];let d=await fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json());rates=d.rates;document.getElementById('geo').innerText=ip.country_name;}catch{}renderCart();}
function checkout(){let g=document.getElementById('grand').innerText;window.open(`https://wa.me/254713367205?text=Order ${cart.length} items Total ${g} Method ${selectedMethod} From ${document.getElementById('origin').value} To ${document.getElementById('dest').value} ${document.getElementById('addr').value}`);}

init();
</script></body></html>
