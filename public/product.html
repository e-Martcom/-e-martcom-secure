<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product - E-MARTCOM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{font-family:'Segoe UI',Arial;background:#f5f5f5;color:#0f172a}
:root{--ocean:#0a4a7a;--cyan:#06b6d4}
header{background:linear-gradient(90deg,var(--ocean),#0e7490);padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.logo{font-weight:900;color:#fff;font-size:22px}.logo span{color:var(--cyan)}
.container{max-width:1300px;margin:16px auto;padding:0 12px;display:grid;grid-template-columns:1.2fr 1fr 300px;gap:14px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.img-main{width:100%;height:380px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid #eee}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow:auto}
.thumbs img{width:60px;height:60px;object-fit:cover;border:2px solid #eee;border-radius:8px;cursor:pointer}
.thumbs img.active{border-color:var(--ocean)}
.price{font-size:28px;font-weight:900;color:var(--ocean)}.old{text-decoration:line-through;color:#94a3b8;font-size:14px;margin-left:8px}
.discount{background:#fef3c7;color:#b45309;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800;margin-left:8px}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:10px}
.btn-cart{background:var(--ocean);color:#fff}
.btn-buy{background:#f68b1e;color:#fff}
.spec-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.spec-table td{border:1px solid #eee;padding:8px}.spec-table td:first-child{background:#f8fafc;font-weight:700;width:35%}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800}
.badge-brand{background:var(--ocean);color:#fff}.badge-stock{background:#dcfce7;color:#166534}
@media(max-width:900px){.container{grid-template-columns:1fr} header{flex-wrap:wrap}}
</style></head><body>
<header>
  <div class="logo" onclick="location.href='/'">E-MART<span>COM</span></div>
  <div style="flex:1;display:flex;max-width:500px"><input id="searchTop" placeholder="Search products..." style="flex:1;padding:10px;border:none;border-radius:20px 0 0 20px"><button onclick="location.href='/?q='+document.getElementById('searchTop').value" style="border:none;background:var(--cyan);color:#fff;padding:10px 18px;border-radius:0 20px 20px 0;font-weight:900">SEARCH</button></div>
  <a href="/" style="color:#fff;text-decoration:none;font-weight:800">🏠 Home</a>
  <div id="cartBtn" onclick="location.href='/#cart'" style="background:#fff;color:var(--ocean);padding:8px 16px;border-radius:20px;font-weight:900">🛒 <span id="cartCount">0</span></div>
</header>

<div class="container" id="productContainer">Loading...</div>

<script>
// === SAME 50 PRODUCTS DB (copy from index) ===
let allProducts=[{id:1,name:"Nike Cotton T-Shirt Pack",price:1800,old:2200,cat:"Apparel & Accessories",brand:"Nike",domain:"nike.com",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",desc:"Nike Brand - 100% Cotton Premium - Pack of 3",specs:{Material:"Cotton",Color:"Mixed",Size:"M,L,XL",Origin:"Kenya"}},{id:2,name:"Samsung Galaxy A15 128GB",price:23500,old:26000,cat:"Consumer Electronics",brand:"Samsung",domain:"samsung.com",img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400",desc:"Samsung - 6.5 inch AMOLED - 50MP Camera - 5000mAh",specs:{Display:"6.5 AMOLED 90Hz",RAM:"6GB",Storage:"128GB",Battery:"5000mAh",Camera:"50MP+5MP+2MP"}},{id:3,name:"Puma Gym Dumbbells 20kg",price:4500,old:5500,cat:"Sports & Entertainment",brand:"Puma",domain:"puma.com",img:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400",desc:"Puma - Cast Iron Dumbbells Pair - Home Gym"},{id:4,name:"Casio Smart Watch T800",price:2500,old:3500,cat:"Jewellery, Eyewear & Watches",brand:"Casio",domain:"casio.com",img:"https://images.unsplash.com/photo-1555421689-3f034debb7a6?w=400",desc:"Casio - Heart Rate - Waterproof - Long Battery"},{id:5,name:"Bata Leather Official Shoes",price:2800,old:3500,cat:"Shoes & Accessories",brand:"Bata",domain:"bata.com",img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400",desc:"Bata - Genuine Leather - Sizes 39-45"},{id:6,name:"Nunix Sufuria Set 7pcs",price:4500,old:5500,cat:"Home & Garden",brand:"Nunix",domain:"nunix.com",img:"https://images.unsplash.com/photo-1585837071057-4ea1e5a1b0a4?w=400",desc:"Nunix - Nonstick 7pcs - Glass Lids"},{id:7,name:"Nivea Body Lotion 400ml",price:650,old:800,cat:"Beauty",brand:"Nivea",domain:"nivea.com",img:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400",desc:"Nivea - 24hrs Moisture - For Dry Skin"},{id:8,name:"Samsonite School Bag Wheels",price:2800,old:3500,cat:"Luggage, Bags & Cases",brand:"Samsonite",domain:"samsonite.com",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400",desc:"Samsonite - Waterproof School Bag With Wheels"},{id:9,name:"Kraft Paper Bags 100pcs",price:800,old:1000,cat:"Packaging & Printing",brand:"Kraft",domain:"kraft.com",img:"https://images.unsplash.com/photo-1607083206968-13611e3d76db?w=400",desc:"Kraft - Eco Friendly Brown Bags 100pcs"},{id:10,name:"Pampers Diapers Size 4",price:1200,old:1500,cat:"Parents, Kids & Toys",brand:"Pampers",domain:"pampers.com",img:"https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=400",desc:"Pampers - 42pcs - 12hrs Dryness"},{id:24,name:"iPhone 13 128GB",price:75000,old:85000,cat:"Consumer Electronics",brand:"Apple",domain:"apple.com",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400",desc:"Apple - 6.1 inch - A15 Bionic - 128GB - Dual Camera",specs:{Display:"6.1 Super Retina",Chip:"A15 Bionic",Storage:"128GB",Camera:"12MP Dual",Battery:"3240mAh"}},{id:25,name:"Tecno Camon 20 Pro",price:24500,old:27000,cat:"Consumer Electronics",brand:"Tecno",domain:"tecno-mobile.com",img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400",desc:"Tecno - 108MP - 8GB RAM"}];
// Add rest dynamically if needed - for now use find
const urlParams = new URLSearchParams(location.search);
let pid = parseInt(urlParams.get('id')) || 2;
let p = allProducts.find(x=>x.id==pid) || allProducts[1];

function load(){
  let discount = Math.round((1 - p.price/p.old)*100);
  document.getElementById('productContainer').innerHTML = `
  <div class="card">
    <img id="mainImg" class="img-main" src="${p.img}">
    <div class="thumbs">
      <img src="${p.img}" class="active" onclick="document.getElementById('mainImg').src=this.src; document.querySelectorAll('.thumbs img').forEach(i=>i.classList.remove('active')); this.classList.add('active')">
      <img src="${p.img}" onclick="document.getElementById('mainImg').src=this.src">
      <img src="https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400" onclick="document.getElementById('mainImg').src=this.src">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400" onclick="document.getElementById('mainImg').src=this.src">
    </div>
    <p style="margin-top:12px;font-size:12px;color:#64748b">SHARE: 📱 WhatsApp | Facebook | Twitter</p>
  </div>

  <div class="card">
    <span class="badge badge-brand">${p.brand}</span> <span class="badge badge-stock">✅ IN STOCK</span>
    <h2 style="margin:10px 0;font-size:20px">${p.name}</h2>
    <p style="font-size:12px;color:#64748b">Brand: <b style="color:var(--ocean)">${p.brand}</b> | Category: ${p.cat}</p>
    <div style="margin:12px 0;display:flex;align-items:center">
      <span class="price">KSh ${p.price.toLocaleString()}</span>
      <span class="old">KSh ${p.old.toLocaleString()}</span>
      <span class="discount">-${discount}%</span>
    </div>
    <p style="font-size:13px;line-height:1.5">${p.desc} - Premium quality from E-MARTCOM Oceanic Store. 1 year warranty. Free delivery in Nairobi.</p>

    <div style="margin:14px 0">
      <label style="font-weight:800;font-size:12px">VARIATION - COLOR:</label><br>
      <div style="display:flex;gap:8px;margin-top:6px">
        <div style="width:32px;height:32px;background:#000;border-radius:50%;border:2px solid var(--ocean);cursor:pointer"></div>
        <div style="width:32px;height:32px;background:#fff;border:1px solid #ddd;border-radius:50%;cursor:pointer"></div>
        <div style="width:32px;height:32px;background:#0a4a7a;border-radius:50%;cursor:pointer"></div>
      </div>
    </div>

    <div style="margin:14px 0">
      <label style="font-weight:800;font-size:12px">QUANTITY:</label><br>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
        <button onclick="let q=document.getElementById('qty'); if(q.value>1) q.value--" style="width:36px;height:36px;border:1px solid #ddd;border-radius:6px">-</button>
        <input id="qty" value="1" style="width:50px;text-align:center;padding:8px;border:1px solid #ddd;border-radius:6px">
        <button onclick="let q=document.getElementById('qty'); q.value++" style="width:36px;height:36px;border:1px solid #ddd;border-radius:6px">+</button>
        <span style="font-size:12px;color:#64748b">(50 pieces available)</span>
      </div>
    </div>

    <button class="btn btn-cart" onclick="addToCart()">🛒 ADD TO CART</button>
    <button class="btn btn-buy" onclick="buyNow()">⚡ BUY NOW - M-PESA</button>

    <table class="spec-table">
      <tr><td>Brand</td><td>${p.brand}</td></tr>
      <tr><td>Category</td><td>${p.cat}</td></tr>
      <tr><td>Shipping</td><td>Air / Sea - 3-7 Days</td></tr>
      <tr><td>Payment</td><td>M-Pesa + Card</td></tr>
      <tr><td>MOQ</td><td>1-5 Pieces</td></tr>
      ${p.specs? Object.entries(p.specs).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('') : ''}
    </table>
  </div>

  <div>
    <div class="card">
      <h4 style="font-size:13px">🚚 DELIVERY & RETURNS</h4>
      <p style="font-size:11px;margin:8px 0;line-height:1.5;color:#334155">
        ✅ Free delivery in Nairobi for orders over KSh 5,000<br>
        ✅ Express delivery 24hrs - KSh 300<br>
        ✅ 7 days free return<br>
        ✅ Warranty 1 year
      </p>
      <hr style="margin:10px 0;border:none;border-top:1px solid #eee">
      <h4 style="font-size:13px">🏪 SELLER INFORMATION</h4>
      <p style="font-size:11px;margin:6px 0">E-MARTCOM Oceanic Store<br>⭐ 4.8 (1,234 ratings)<br>📍 Nairobi, Kenya - Ships worldwide via 1688/Jumia</p>
      <button onclick="location.href='/'" style="width:100%;padding:10px;border:1px solid var(--ocean);background:#fff;color:var(--ocean);border-radius:8px;font-weight:800;margin-top:8px">Visit Store →</button>
    </div>
  </div>
  `;

  // 🌊 SECRET LOGGING - Customer doesn't see!
  fetch('/api/external-order', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      productId: p.id,
      productName: p.name,
      customerPrice: p.price,
      image: p.img,
      brand: p.brand,
      category: p.cat,
      source: 'product_view',
      profit: Math.floor(p.price*0.4),
      time: new Date().toISOString()
    })
  }).then(r=>r.json()).then(d=>console.log('🌊 Logged:', d)).catch(()=>{});
}

function addToCart(){
  let cart = JSON.parse(localStorage.getItem('cart')||'[]');
  let qty = parseInt(document.getElementById('qty').value)||1;
  let ex = cart.find(x=>x.id==p.id);
  if(ex) ex.qty+=qty; else cart.push({id:p.id,name:p.name,price:p.price,brand:p.brand,image:p.img,qty});
  localStorage.setItem('cart', JSON.stringify(cart));
  alert(`✅ ${p.name} x${qty} added to cart!`);
  location.href='/#cart';
}
function buyNow(){ addToCart(); location.href='/#checkout'; }

load();
</script>
</body></html>
