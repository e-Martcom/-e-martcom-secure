<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-MARTCOM GLOBAL</title>
<style>body{font-family:Arial;background:#f5f5f5;margin:0}header{background:#0a4a7a;padding:12px;color:#fff;display:flex;gap:10px;align-items:center;position:sticky;top:0}.grid{max-width:1300px;margin:10px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:10px}.card{background:#fff;border-radius:10px;padding:8px;text-decoration:none;color:#000;display:block;border:1px solid #eee}.card img{width:100%;height:140px;object-fit:contain}.grand{background:#0a4a7a;color:#fff;padding:6px;border-radius:6px;text-align:center;font-weight:900;margin-top:6px}</style></head><body>
<header><div style="font-weight:900">E-MARTCOM GLOBAL</div><div style="flex:1"></div><a href="cart.html" style="background:#fff;color:#0a4a7a;padding:6px 12px;border-radius:20px;text-decoration:none;font-weight:900">🛒 <span id="cartCount">0</span></a></header>
<div style="max-width:1300px;margin:10px auto;padding:10px"><select id="dest" onchange="localStorage.setItem('shipDest',this.value);location.reload()"><option value="ke">To Kenya</option><option value="ug">Uganda</option><option value="ng">Nigeria</option><option value="us">USA</option><option value="ae">UAE</option><option value="gb">UK</option></select> <select id="method" onchange="localStorage.setItem('shipMethod',this.value);location.reload()"><option value="air">Air</option><option value="sea">Sea -65%</option><option value="eparcel">E-parcel</option><option value="rail">Rail</option></select></div>
<div class="grid" id="grid"></div>
<script>
const BASE={china:{ke:12,ug:15,ng:18,us:20,ae:16,gb:20},kenya:{ke:1.5,ug:8,ng:15,us:18,ae:15,gb:18},usa:{ke:20,ug:22,ng:24,us:2,ae:16,gb:14},japan:{ke:26,ug:28,ng:30,us:22,ae:18,gb:16},canada:{ke:24,ug:26,ng:28,us:12,ae:20,gb:14},germany:{ke:18,ug:20,ng:22,us:14,ae:12,gb:6},uk:{ke:18,ug:20,ng:22,us:14,ae:12,gb:2},uae:{ke:12,ug:14,ng:16,us:16,ae:2,gb:12},turkey:{ke:14,ug:16,ng:18,us:15,ae:6,gb:8}};
const MM={air:1,sea:0.35,eparcel:0.65,rail:0.55};
let all=[{id:1,n:"Nike T-Shirt 3pcs",p:13.85,old:17,w:0.2,o:["turkey","china","kenya"],img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"},{id:2,n:"Samsung A15 128GB",p:180.77,old:200,w:0.4,o:["china","kenya","uae"],img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400"},{id:3,n:"Puma Dumbbells 20kg",p:34.62,old:42,w:20,o:["kenya"],img:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400"},{id:4,n:"Casio Smart Watch",p:19.23,old:26.92,w:0.15,o:["japan","china","usa"],img:"https://images.unsplash.com/photo-1555421689-3f034debb7a6?w=400"},{id:5,n:"Bata Leather Shoes",p:21.54,old:26.92,w:0.8,o:["kenya","turkey","china"],img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400"},{id:6,n:"Nunix Sufuria Set",p:34.62,old:42,w:3.5,o:["kenya","china"],img:"https://images.unsplash.com/photo-1585837071057-4ea1e5a1b0a4?w=400"}];
let dest=localStorage.getItem('shipDest')||'ke';let method=localStorage.getItem('shipMethod')||'air';
document.getElementById('dest').value=dest;document.getElementById('method').value=method;
function shipCost(origin,d,w){let b=BASE[origin]?.[d]||20;let mult=w<=0.5?1:w<=1?1.5:w<=2?2.2:w<=5?3.8:w<=10?6.5:12;return b*mult*MM[method];}
let html='';all.forEach(pr=>{
let costs=pr.o.map(o=>({o,c:shipCost(o,dest,pr.w)}));let cheap=costs.sort((a,b)=>a.c-b.c)[0];let grand=pr.p+cheap.c;
html+=`<a class="card" href="product.html?id=${pr.id}">
<img src="${pr.img}">
<div style="font-weight:800;font-size:12px">${pr.n}</div>
<div style="font-size:9px;color:#666">${pr.o.join(',').toUpperCase()} → ${dest.toUpperCase()} ${method.toUpperCase()}</div>
<div style="font-size:10px">$${pr.p} + Ship $${cheap.c.toFixed(2)}</div>
<div class="grand">$${grand.toFixed(2)} INCLUSIVE</div>
</a>`;
});
document.getElementById('grid').innerHTML=html;
document.getElementById('cartCount').innerText=JSON.parse(localStorage.getItem('cart')||'[]').reduce((s,i)=>s+i.qty,0);
</script></body></html>
