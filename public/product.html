<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product</title>
<style>body{font-family:Arial;background:#f5f5f5;margin:0}header{background:#0a4a7a;padding:12px;color:#fff;display:flex;gap:10px}.wrap{max-width:1000px;margin:10px auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.card{background:#fff;border-radius:10px;padding:12px}.card img{width:100%;height:300px;object-fit:contain}.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;margin-top:8px;cursor:pointer}.btn-cart{background:#0a4a7a;color:#fff}.btn-buy{background:#f68b1e;color:#fff} @media(max-width:700px){.wrap{grid-template-columns:1fr}}</style></head><body>
<header><a href="index.html" style="color:#fff;text-decoration:none;font-weight:900">← E-MARTCOM GLOBAL</a><div style="flex:1"></div><a href="cart.html" style="background:#fff;color:#0a4a7a;padding:6px 12px;border-radius:20px;text-decoration:none;font-weight:900">🛒 Cart</a></header>
<div class="wrap" id="prod"></div>
<script>
const BASE={china:{ke:12,ug:15,ng:18,us:20,ae:16,gb:20},kenya:{ke:1.5,ug:8,ng:15,us:18,ae:15,gb:18},usa:{ke:20,ug:22,ng:24,us:2,ae:16,gb:14},japan:{ke:26,ug:28,ng:30,us:22,ae:18,gb:16},canada:{ke:24,ug:26,ng:28,us:12,ae:20,gb:14},germany:{ke:18,ug:20,ng:22,us:14,ae:12,gb:6},uk:{ke:18,ug:20,ng:22,us:14,ae:12,gb:2},uae:{ke:12,ug:14,ng:16,us:16,ae:2,gb:12},turkey:{ke:14,ug:16,ng:18,us:15,ae:6,gb:8}};
const MM={air:{m:1,t:"Air 3-7d"},sea:{m:0.35,t:"Sea 20-45d -65%"},eparcel:{m:0.65,t:"E-parcel 10-20d"},rail:{m:0.55,t:"Rail 15-25d"}};
let all=[{id:1,n:"Nike T-Shirt 3pcs",p:13.85,old:17,w:0.2,o:["turkey","china","kenya"],img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",d:"Cotton 3pcs"},{id:2,n:"Samsung A15 128GB",p:180.77,old:200,w:0.4,o:["china","kenya","uae"],img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400",d:"6.5 AMOLED 50MP"},{id:3,n:"Puma Dumbbells 20kg",p:34.62,old:42,w:20,o:["kenya"],img:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400",d:"Heavy Kenya only"},{id:4,n:"Casio Smart Watch",p:19.23,old:26.92,w:0.15,o:["japan","china","usa"],img:"https://images.unsplash.com/photo-1555421689-3f034debb7a6?w=400",d:"Japan Movement"},{id:5,n:"Bata Leather Shoes",p:21.54,old:26.92,w:0.8,o:["kenya","turkey","china"],img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400",d:"Genuine Leather"},{id:6,n:"Nunix Sufuria Set",p:34.62,old:42,w:3.5,o:["kenya","china"],img:"https://images.unsplash.com/photo-1585837071057-4ea1e5a1b0a4?w=400",d:"Nonstick 7pcs"}];
let pid=new URLSearchParams(location.search).get('id')||1;let pr=all.find(x=>x.id==pid)||all[0];
let dest=localStorage.getItem('shipDest')||'ke';let method=localStorage.getItem('shipMethod')||'air';let origin=pr.o[0];
function base(o,d,w){let b=BASE[o]?.[d]||20;let mult=w<=0.5?1:w<=1?1.5:w<=2?2.2:w<=5?3.8:w<=10?6.5:12;return b*mult;}
function render(){
let ship=base(origin,dest,pr.w)*MM[method].m;let grand=pr.p+ship;
document.getElementById('prod').innerHTML=`
<div class="card"><img src="${pr.img}"><p>${pr.d}<br>Weight: ${pr.w}kg<br>Origins: ${pr.o.join(', ')}</p></div>
<div class="card">
<h2>${pr.n}</h2><p>$${pr.p} <s style="color:#999">$${pr.old}</s></p>
<p>Ship To: <select onchange="dest=this.value;localStorage.setItem('shipDest',dest);render()"><option value="ke" ${dest=='ke'?'selected':''}>Kenya</option><option value="ug" ${dest=='ug'?'selected':''}>Uganda</option><option value="ng" ${dest=='ng'?'selected':''}>Nigeria</option><option value="us" ${dest=='us'?'selected':''}>USA</option><option value="ae" ${dest=='ae'?'selected':''}>UAE</option><option value="gb" ${dest=='gb'?'selected':''}>UK</option></select></p>
<div>${pr.o.map(o=>`<div style="border:2px solid ${o==origin?'#0a4a7a':'#eee'};padding:8px;border-radius:8px;margin:4px 0;cursor:pointer" onclick="origin='${o}';render()">${o.toUpperCase()} - Ship $${(base(o,dest,pr.w)*MM[method].m).toFixed(2)} - Grand $${(pr.p+base(o,dest,pr.w)*MM[method].m).toFixed(2)} INCL ${o==origin?'✅':''}</div>`).join('')}</div>
<div>${Object.keys(MM).map(m=>{let c=base(origin,dest,pr.w)*MM[m].m;let g=pr.p+c;return `<div style="border:2px solid ${m==method?'#f68b1e':'#eee'};padding:8px;border-radius:8px;margin:4px 0;cursor:pointer" onclick="method='${m}';localStorage.setItem('shipMethod',m);render()">${MM[m].t} - Ship $${c.toFixed(2)} = <b>$${g.toFixed(2)} INCL</b> ${m==method?'✅':''}</div>`}).join('')}</div>
<div style="background:#ecfeff;padding:10px;border-radius:8px;margin-top:8px">
<div>Product: $${pr.p}</div><div>Shipping ${origin.toUpperCase()}→${dest.toUpperCase()} ${method.toUpperCase()}: $${ship.toFixed(2)}</div>
<div style="font-weight:900;font-size:18px;border-top:2px solid #0a4a7a;margin-top:6px;padding-top:6px">Grand INCLUSIVE: $${grand.toFixed(2)}</div>
</div>
<input id="qty" type="number" value="1" min="1" style="padding:10px;border:2px solid #eee;border-radius:8px;width:80px;margin-top:8px">
<button class="btn btn-cart" onclick="addCart()">ADD TO CART - $${grand.toFixed(2)} INCLUSIVE</button>
<button class="btn btn-buy" onclick="addCart();location.href='cart.html'">BUY NOW</button>
</div>`;
}
function addCart(){let cart=JSON.parse(localStorage.getItem('cart')||'[]');let qty=parseInt(document.getElementById('qty').value)||1;let ship=base(origin,dest,pr.w)*MM[method].m;let ex=cart.find(x=>x.id==pr.id&&x.source==origin&&x.shipMethod==method);if(ex)ex.qty+=qty;else cart.push({id:pr.id,name:pr.n,price:pr.p,priceUSD:pr.p,qty,weight:pr.w,source:origin,shipMethod:method,dest,shipCost:ship,image:pr.img});localStorage.setItem('cart',JSON.stringify(cart));localStorage.setItem('shipDest',dest);localStorage.setItem('shipMethod',method);alert(`Added: ${pr.n}\nProduct $${pr.p} x${qty} + Ship $${ship.toFixed(2)} x${qty} = Grand $${((pr.p+ship)*qty).toFixed(2)} INCLUSIVE`);}
render();
</script></body></html>
