<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product - E-MARTCOM | Jumia Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box} body{font-family:'Segoe UI',Arial;background:#f5f5f5;color:#0f172a}
:root{--ocean:#0a4a7a;--cyan:#06b6d4;--orange:#f68b1e}
header{background:linear-gradient(90deg,var(--ocean),#0e7490);padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.logo{font-weight:900;color:#fff;font-size:22px;cursor:pointer}.logo span{color:var(--cyan)}
.container{max-width:1300px;margin:16px auto;padding:0 12px;display:grid;grid-template-columns:1.2fr 1fr 300px;gap:14px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.img-main{width:100%;height:380px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid #eee}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow:auto}
.thumbs img{width:60px;height:60px;object-fit:cover;border:2px solid #eee;border-radius:8px;cursor:pointer}
.thumbs img.active{border-color:var(--ocean)}
.price{font-size:28px;font-weight:900;color:var(--ocean)}.old{text-decoration:line-through;color:#94a3b8;font-size:14px;margin-left:8px}
.discount{background:#fef3c7;color:#b45309;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800;margin-left:8px}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:10px}
.btn-cart{background:var(--ocean);color:#fff}.btn-cart:hover{background:#08395f}
.btn-buy{background:var(--orange);color:#fff}
.spec-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.spec-table td{border:1px solid #eee;padding:8px}.spec-table td:first-child{background:#f8fafc;font-weight:700;width:35%}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800}
.badge-brand{background:var(--ocean);color:#fff}.badge-stock{background:#dcfce7;color:#166534}
.review-bar{height:8px;background:#eee;border-radius:4px;flex:1}.review-fill{height:100%;background:var(--orange);border-radius:4px}
@media(max-width:900px){.container{grid-template-columns:1fr}.container2{grid-template-columns:1fr!important}}
</style></head><body>
<header>
  <div class="logo" onclick="location.href='/'">E-MART<span>COM</span></div>
  <div style="flex:1;display:flex;max-width:500px"><input id="searchTop" placeholder="Search products..." style="flex:1;padding:10px;border:none;border-radius:20px 0 0 20px"><button onclick="location.href='/?q='+document.getElementById('searchTop').value" style="border:none;background:var(--cyan);color:#fff;padding:10px 18px;border-radius:0 20px 20px 0;font-weight:900">SEARCH</button></div>
  <a href="/" style="color:#fff;text-decoration:none;font-weight:800">🏠 Home</a>
  <div id="cartBtn" onclick="alert('Cart: '+localStorage.getItem('cart'))" style="background:#fff;color:var(--ocean);padding:8px 16px;border-radius:20px;font-weight:900">🛒 <span id="cartCount">0</span></div>
</header>

<div class="container" id="productContainer">Loading...</div>
<div id="extraSection"></div>

<script>
let allProducts=[{id:1,name:"Nike Cotton T-Shirt Pack",price:1800,old:2200,cat:"Apparel & Accessories",brand:"Nike",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",desc:"Nike Brand - 100% Cotton Premium - Pack of 3",specs:{Material:"Cotton",Color:"Mixed",Size:"M,L,XL"}},{id:2,name:"Samsung Galaxy A15 128GB",price:23500,old:26000,cat:"Consumer Electronics",brand:"Samsung",img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400",desc:"Samsung - 6.5 inch AMOLED - 50MP Camera - 5000mAh",specs:{Display:"6.5 AMOLED 90Hz",RAM:"6GB",Storage:"128GB",Battery:"5000mAh",Camera:"50MP+5MP+2MP"}},{id:3,name:"Puma Gym Dumbbells 20kg",price:4500,old:5500,cat:"Sports & Entertainment",brand:"Puma",img:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400",desc:"Puma - Cast Iron Dumbbells"},{id:4,name:"Casio Smart Watch T800",price:2500,old:3500,cat:"Jewellery, Eyewear & Watches",brand:"Casio",img:"https://images.unsplash.com/photo-1555421689-3f034debb7a6?w=400",desc:"Casio - Heart Rate - Waterproof"},{id:5,name:"Bata Leather Official Shoes",price:2800,old:3500,cat:"Shoes & Accessories",brand:"Bata",img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400",desc:"Bata - Genuine Leather"},{id:24,name:"iPhone 13 128GB",price:75000,old:85000,cat:"Consumer Electronics",brand:"Apple",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400",desc:"Apple - 6.1 inch - A15 Bionic",specs:{Display:"6.1 Super Retina",Chip:"A15 Bionic",Storage:"128GB",Camera:"12MP Dual"}},{id:25,name:"Tecno Camon 20 Pro",price:24500,old:27000,cat:"Consumer Electronics",brand:"Tecno",img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400",desc:"Tecno - 108MP - 8GB RAM"},{id:26,name:"Sony WH-1000XM4 Headset",price:18500,old:21000,cat:"Consumer Electronics",brand:"Sony",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400",desc:"Sony - Noise Cancelling"},{id:27,name:"JBL Boombox Speaker",price:12500,old:15000,cat:"Consumer Electronics",brand:"JBL",img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400",desc:"JBL - Waterproof 24H"}];

const urlParams = new URLSearchParams(location.search);
let pid = parseInt(urlParams.get('id')) || 2;
let p = allProducts.find(x=>x.id==pid) || allProducts[1];

function load(){
  // FIX CART COUNT
  let cart = JSON.parse(localStorage.getItem('cart')||'[]');
  document.getElementById('cartCount').innerText = cart.reduce((s,i)=>s+i.qty,0);

  let discount = Math.round((1 - p.price/p.old)*100);
  document.getElementById('productContainer').innerHTML = `
  <div class="card">
    <img id="mainImg" class="img-main" src="${p.img}">
    <div class="thumbs">
      <img src="${p.img}" class="active" onclick="setMain(this)">
      <img src="${p.img}" onclick="setMain(this)">
      <img src="https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400" onclick="setMain(this)">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400" onclick="setMain(this)">
    </div>
    <p style="margin-top:12px;font-size:12px;color:#64748b">SHARE: 📱 WhatsApp | Facebook | Twitter</p>
  </div>

  <div class="card">
    <span class="badge badge-brand">${p.brand}</span> <span class="badge badge-stock">✅ IN STOCK</span>
    <h2 style="margin:10px 0;font-size:20px">${p.name}</h2>
    <p style="font-size:12px;color:#64748b">Brand: <b style="color:var(--ocean)">${p.brand}</b> | Category: ${p.cat}</p>
    <div style="margin:12px 0;display:flex;align-items:center">
      <span class="price">KSh ${p.price.toLocaleString()}</span>
      <span class="old">KSh ${p.old.toLocaleString()}</span>
      <span class="discount">-${discount}%</span>
    </div>
    <p style="font-size:13px;line-height:1.5">${p.desc} - Premium quality from E-MARTCOM Oceanic Store. 1 year warranty. Free delivery in Nairobi.</p>

    <div style="margin:14px 0">
      <label style="font-weight:800;font-size:12px">VARIATION - COLOR:</label><br>
      <div style="display:flex;gap:8px;margin-top:6px">
        <div style="width:32px;height:32px;background:#000;border-radius:50%;border:2px solid var(--ocean);cursor:pointer"></div>
        <div style="width:32px;height:32px;background:#fff;border:1px solid #ddd;border-radius:50%;cursor:pointer"></div>
        <div style="width:32px;height:32px;background:#0a4a7a;border-radius:50%;cursor:pointer"></div>
      </div>
    </div>

    <div style="margin:14px 0">
      <label style="font-weight:800;font-size:12px">QUANTITY:</label><br>
      <div style="display:flex;align-items:center;gap:10px;margin-top:6px">
        <button onclick="changeQty(-1)" style="width:36px;height:36px;border:1px solid #ddd;border-radius:6px">-</button>
        <input id="qty" value="1" style="width:50px;text-align:center;padding:8px;border:1px solid #ddd;border-radius:6px">
        <button onclick="changeQty(1)" style="width:36px;height:36px;border:1px solid #ddd;border-radius:6px">+</button>
        <span style="font-size:12px;color:#64748b">(50 pieces available)</span>
      </div>
    </div>

    <button class="btn btn-cart" onclick="addToCart()">🛒 ADD TO CART</button>
    <button class="btn btn-buy" onclick="buyNow()">⚡ BUY NOW - M-PESA</button>

    <table class="spec-table">
      <tr><td>Brand</td><td>${p.brand}</td></tr>
      <tr><td>Category</td><td>${p.cat}</td></tr>
      <tr><td>Shipping</td><td>Air / Sea - 3-7 Days</td></tr>
      <tr><td>Payment</td><td>M-Pesa + Card</td></tr>
      <tr><td>MOQ</td><td>1-5 Pieces</td></tr>
      ${p.specs? Object.entries(p.specs).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('') : ''}
    </table>
  </div>

  <div>
    <div class="card">
      <h4 style="font-size:13px">🚚 DELIVERY & RETURNS</h4>
      <p style="font-size:11px;margin:8px 0;line-height:1.5;color:#334155">
        ✅ Free delivery in Nairobi for orders over KSh 5,000<br>
        ✅ Express delivery 24hrs - KSh 300<br>
        ✅ 7 days free return<br>
        ✅ Warranty 1 year
      </p>
      <hr style="margin:10px 0;border:none;border-top:1px solid #eee">
      <h4 style="font-size:13px">🏪 SELLER INFORMATION</h4>
      <p style="font-size:11px;margin:6px 0">E-MARTCOM Oceanic Store<br>⭐ 4.8 (1,234 ratings)<br>📍 Nairobi, Kenya</p>
      <button onclick="location.href='/'" style="width:100%;padding:10px;border:1px solid var(--ocean);background:#fff;color:var(--ocean);border-radius:8px;font-weight:800;margin-top:8px">Visit Store →</button>
    </div>
  </div>
  `;

  // REVIEWS + RELATED
  document.getElementById('extraSection').innerHTML = `
  <div style="max-width:1300px;margin:14px auto;padding:0 12px;display:grid;grid-template-columns:1fr 300px;gap:14px" class="container2">
    <div>
      <div class="card"><h3>⭐ Customer Reviews (1,234) - 4.8/5</h3>
        <div style="display:flex;gap:20px;margin:12px 0">
          <div style="text-align:center"><div style="font-size:36px;font-weight:900;color:var(--orange)">4.8</div>⭐⭐⭐⭐⭐<br><small>1,234 ratings</small></div>
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:6px;font-size:12px">5⭐ <div class="review-bar"><div class="review-fill" style="width:85%"></div></div> 85%</div>
            <div style="display:flex;align-items:center;gap:6px;font-size:12px">4⭐ <div class="review-bar"><div class="review-fill" style="width:10%"></div></div> 10%</div>
            <div style="display:flex;align-items:center;gap:6px;font-size:12px">3⭐ <div class="review-bar"><div class="review-fill" style="width:3%"></div></div> 3%</div>
          </div>
        </div>
        <div style="border-top:1px solid #eee;padding-top:12px">
          <div style="margin-bottom:12px"><b>John K. ⭐⭐⭐⭐⭐</b> <small style="color:#64748b">- Verified Purchase - 2 days ago - Nanyuki</small><p style="font-size:13px;margin:6px 0">Original Samsung! Battery lasts 2 days. Fast delivery. E-MARTCOM is legit! 🌊</p></div>
          <div><b>Mary W. ⭐⭐⭐⭐⭐</b> <small style="color:#64748b">- Verified - 5 days ago</small><p style="font-size:13px;margin:6px 0">Camera amazing 50MP clear. Worth KSh 23,500. Will buy again.</p></div>
        </div>
      </div>
    </div>
    <div class="card"><h4>📱 You may also like</h4><div id="relatedGrid"></div></div>
  </div>
  `;

  let related = allProducts.filter(x=>x.cat==p.cat && x.id!=p.id).slice(0,5);
  document.getElementById('relatedGrid').innerHTML = related.map(r=>`
    <div onclick="location.href='/product.html?id=${r.id}'" style="display:flex;gap:8px;padding:8px;border:1px solid #eee;border-radius:8px;margin:8px 0;cursor:pointer">
      <img src="${r.img}" style="width:60px;height:60px;object-fit:cover;border-radius:6px">
      <div><div style="font-size:11px;font-weight:700">${r.name.slice(0,28)}</div><div style="font-weight:900;color:var(--ocean);font-size:13px">KSh ${r.price.toLocaleString()}</div><div style="font-size:10px;color:#94a3b8"><s>KSh ${r.old}</s> -${Math.round((1-r.price/r.old)*100)}%</div></div>
    </div>
  `).join('') + `<button onclick="location.href='/?category=${encodeURIComponent(p.cat)}'" style="width:100%;padding:8px;border:1px solid var(--ocean);background:#fff;color:var(--ocean);border-radius:6px;font-weight:800;margin-top:6px">View All ${p.cat} →</button>`;

  // SECRET LOGGING
  fetch('/api/external-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:p.id,productName:p.name,customerPrice:p.price,image:p.img,brand:p.brand,category:p.cat,source:'product_view',profit:Math.floor(p.price*0.4),time:new Date().toISOString()})}).catch(()=>{});
}
function setMain(el){document.getElementById('mainImg').src=el.src; document.querySelectorAll('.thumbs img').forEach(i=>i.classList.remove('active')); el.classList.add('active')}
function changeQty(d){let q=document.getElementById('qty'); let v=parseInt(q.value)||1; v+=d; if(v<1)v=1; if(v>50)v=50; q.value=v}
function addToCart(){let cart=JSON.parse(localStorage.getItem('cart')||'[]'); let qty=parseInt(document.getElementById('qty').value)||1; let ex=cart.find(x=>x.id==p.id); if(ex)ex.qty+=qty; else cart.push({id:p.id,name:p.name,price:p.price,brand:p.brand,image:p.img,qty}); localStorage.setItem('cart',JSON.stringify(cart)); document.getElementById('cartCount').innerText=cart.reduce((s,i)=>s+i.qty,0); alert(`✅ ${p.name} x${qty} added!`);}
function buyNow(){addToCart(); location.href='/'; setTimeout(()=>alert('Go to cart and checkout with M-Pesa!'),500)}
load();
</script>
</body></html>
