<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-MARTCOM - Global Dropship Kenya</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial;background:#eef6fb;color:#0f172a}
header{background:linear-gradient(90deg,#082f4a,#0a4a7a);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.logo{font-weight:900;font-size:20px;cursor:pointer}.logo span{color:#06b6d4}
.search{flex:1;min-width:200px;display:flex;background:#fff;border-radius:24px;overflow:hidden}
.search input{flex:1;padding:10px 14px;border:none;outline:none;font-size:14px}
.search button{padding:10px 18px;border:none;background:#f68b1e;color:#fff;font-weight:900;cursor:pointer}
.cartBtn{background:#fff;color:#0a4a7a;padding:8px 14px;border-radius:20px;font-weight:900;font-size:12px;cursor:pointer;border:none;text-decoration:none;display:inline-block}
.wrap{max-width:1200px;margin:14px auto;padding:0 12px}
.filters{display:flex;gap:8px;overflow:auto;padding:8px 0}
.filters button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:2px solid #e0f2fe;background:#fff;font-weight:700;cursor:pointer;font-size:12px}
.filters button.active{background:#0a4a7a;color:#fff;border-color:#0a4a7a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 4px 12px rgba(10,74,122,.08);border:1px solid #e0f2fe;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(10,74,122,.15)}
.card img{width:100%;height:140px;object-fit:contain;background:#f8fafc;border-radius:10px}
.card b{display:block;font-size:12px;margin:6px 0;height:32px;overflow:hidden}
.price{color:#0a4a7a;font-weight:900;font-size:14px}.small{font-size:10px;color:#64748b}
.add{width:100%;padding:8px;border:none;border-radius:10px;background:#0a4a7a;color:#fff;font-weight:800;cursor:pointer;margin-top:6px;font-size:11px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header>
<div class="logo" onclick="location.href='/'">E-MART<span>COM</span> 🌊</div>
<div class="search"><input id="q" placeholder="Search products e.g. bracelet, phone case..." onkeyup="if(event.key==='Enter')doSearch()"><button onclick="doSearch()">🔍</button></div>
<a href="cart.html" class="cartBtn" id="cartBtn">🛒 0</a>
<a href="supplier.html" style="background:#06b6d4;color:#fff;padding:8px 12px;border-radius:20px;font-weight:800;font-size:11px;text-decoration:none">Become Supplier</a>
<a href="my-account.html" style="background:#fff;color:#0a4a7a;padding:8px 12px;border-radius:20px;font-weight:800;font-size:11px;text-decoration:none">👤 Account</a>
</header>

<div class="wrap">
<div style="background:linear-gradient(90deg,#fffbeb,#ecfeff);border:1px solid #fef3c7;padding:12px;border-radius:12px;font-size:12px">
<b>🌍 Ships from China → Kenya direct!</b> E-parcel 10-20d • Air 3-7d • Sea 20-45d cheapest. Supplier ships DIRECT to your full address - no middleman!
</div>

<div class="filters" id="filters">
<button class="active" onclick="filterCat('all',this)">All</button>
<button onclick="filterCat('jewelry',this)">💍 Jewelry</button>
<button onclick="filterCat('electronics',this)">📱 Electronics</button>
<button onclick="filterCat('apparel',this)">👕 Apparel</button>
<button onclick="filterCat('home',this)">🏠 Home</button>
</div>

<div class="grid" id="grid"></div>
</div>

<script>
const PRODUCTS=[
{id:1,name:"Clover Bracelet 18K Gold Plated - Lucky Clover",price:1.87,weight:0.05,source:"china",cat:"jewelry",img:"https://images.unsplash.com/photo-1611652022419-a9419f74343d?w=300"},
{id:2,name:"Samsung A71 Phone Case - Protective",price:2.5,weight:0.1,source:"china",cat:"electronics",img:"https://images.unsplash.com/photo-1583394838336-acd977736f90?w=300"},
{id:3,name:"Nike T-Shirt Sports Shorts Set Men",price:5.2,weight:0.2,source:"china",cat:"apparel",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300"},
{id:4,name:"Oceanic Watch Luxury Steel",price:2.2,weight:0.2,source:"china",cat:"jewelry",img:"https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=300"},
{id:5,name:"iPhone 14 Pro Case Clear",price:2.0,weight:0.15,source:"china",cat:"electronics",img:"https://images.unsplash.com/photo-1605236453806-6ff36851218e?w=300"},
];
let activeCat='all';
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function getCart(){return JSON.parse(localStorage.getItem('cart')||'[]');}
function saveCart(c){localStorage.setItem('cart',JSON.stringify(c));updateCartBtn();}
function updateCartBtn(){let c=getCart(); document.getElementById('cartBtn').innerText='🛒 '+c.reduce((s,i)=>s+(parseInt(i.qty)||0),0);}
function goProduct(id){
 // FIXED: was?idx= now?id= - matches product.html
 location.href='product.html?id='+id;
}
function addToCart(id, e){
 if(e) e.stopPropagation();
 let cart=getCart();
 let prod=PRODUCTS.find(p=>p.id===id);
 if(!prod) return;
 // FRAUD-PROOF: store only id/qty/source - price comes from server PRODUCT_DB
 let found=cart.find(i=>parseInt(i.id)===id);
 if(found) found.qty=parseInt(found.qty||1)+1;
 else cart.push({id:prod.id, qty:1, source:prod.source, name:prod.name, image:prod.img, price:prod.price, weight:prod.weight});
 saveCart(cart);
 let btn=e?.target; if(btn){let t=btn.innerText; btn.innerText='✅ Added'; setTimeout(()=>btn.innerText=t,1000);}
}
function render(list){
 let g=document.getElementById('grid');
 g.innerHTML=list.map(p=>`
 <div class="card" onclick="goProduct(${p.id})">
 <img src="${esc(p.img)}" loading="lazy" onerror="this.src='https://via.placeholder.com/300?text=E-MARTCOM'">
 <b>${esc(p.name)}</b>
 <div class="small">${esc(p.source.toUpperCase())} → KE • ${p.weight}kg</div>
 <div class="price">$${p.price.toFixed(2)} <span class="small">+ ship</span></div>
 <button class="add" onclick="addToCart(${p.id},event)">Add to Cart 🛒</button>
 </div>`).join('');
}
function filterCat(cat, el){
 activeCat=cat;
 document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
 if(el) el.classList.add('active');
 let list=cat==='all'?PRODUCTS:PRODUCTS.filter(p=>p.cat===cat);
 let q=document.getElementById('q').value.trim().toLowerCase();
 if(q) list=list.filter(p=>p.name.toLowerCase().includes(q));
 render(list);
}
function doSearch(){
 let q=document.getElementById('q').value.trim().toLowerCase();
 let list=PRODUCTS.filter(p=> p.name.toLowerCase().includes(q) || (activeCat!=='all' && p.cat===activeCat) || activeCat==='all');
 if(activeCat!=='all') list=list.filter(p=>p.cat===activeCat);
 if(!q && activeCat==='all') list=PRODUCTS;
 if(q && activeCat!=='all') list=PRODUCTS.filter(p=>p.name.toLowerCase().includes(q) && p.cat===activeCat);
 if(q && activeCat==='all') list=PRODUCTS.filter(p=>p.name.toLowerCase().includes(q));
 render(list);
}
render(PRODUCTS); updateCartBtn();
</script></body></html>
