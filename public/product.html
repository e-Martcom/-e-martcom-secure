<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product - Global Ship Origin Chooser</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial;background:#f5f5f5;color:#0f172a}header{background:linear-gradient(90deg,#0a4a7a,#0e7490);padding:12px 16px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:20}.logo{font-weight:900;color:#fff;font-size:22px;cursor:pointer}.container{max-width:1300px;margin:12px auto;padding:0 10px;display:grid;grid-template-columns:1.2fr 1fr 320px;gap:12px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.origin-opt{border:2px solid #e0f2fe;border-radius:10px;padding:8px;margin:5px 0;cursor:pointer;display:flex;justify-content:space-between;font-size:12px}.origin-opt.active{border-color:#0a4a7a;background:#ecfeff}.ship-opt{border:1px solid #e0f2fe;border-radius:8px;padding:7px;margin:4px 0;cursor:pointer;font-size:11px;display:flex;justify-content:space-between}.ship-opt.active{border-color:#f68b1e;background:#fff7ed}.price{font-size:26px;font-weight:900;color:#0a4a7a}.btn{width:100%;padding:13px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:8px}.btn-cart{background:#0a4a7a;color:#fff}.btn-buy{background:#f68b1e;color:#fff}@media(max-width:900px){.container{grid-template-columns:1fr}}</style></head><body>
<header><div class="logo" onclick="location.href='/'">E-MART<span style="color:#06b6d4">COM</span></div><div style="flex:1"></div><div id="geo" style="color:#fff;font-size:11px;font-weight:800">🌍 Global Origins</div><div onclick="location.href='/cart.html'" style="background:#fff;color:#0a4a7a;padding:8px 14px;border-radius:20px;font-weight:900;cursor:pointer">🛒 <span id="cartCount">0</span></div></header>

<div class="container" id="prodContainer">Loading...</div>

<script>
// SAME BASE MATRIX as cart
const BASE_AIR={china:{ke:12,ug:15,ng:18,us:20,ca:20,jp:14,gb:20,de:20,ae:16},kenya:{ke:1.5,ug:8,ng:15,us:18,ca:22,jp:24,gb:18,de:18,ae:15},canada:{ke:24,ug:26,ng:28,us:12,ca:2,jp:18,gb:14,de:15,ae:20},japan:{ke:26,ug:28,ng:30,us:22,ca:18,jp:2,gb:16,de:16,ae:18},usa:{ke:20,ug:22,ng:24,us:2,ca:12,jp:22,gb:14,de:14,ae:16},germany:{ke:18,ug:20,ng:22,us:14,ca:15,jp:16,gb:6,de:2,ae:12},uk:{ke:18,ug:20,ng:22,us:14,ca:14,jp:16,gb:2,de:6,ae:12},uae:{ke:12,ug:14,ng:16,us:16,ca:20,jp:18,gb:12,de:12,ae:2},turkey:{ke:14,ug:16,ng:18,us:15,ca:16,jp:17,gb:8,de:7,ae:6}};
const METHOD={air:{m:1.0,t:"3-7 days"},eparcel:{m:0.65,t:"10-20 days"},sea:{m:0.35,t:"20-45 days"},rail:{m:0.55,t:"15-25 days"}};

let allProducts=[{id:2,name:"Samsung Galaxy A15 128GB",price:180.77,old:200,brand:"Samsung",cat:"Consumer Electronics",img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400",weight:0.4,desc:"6.5 AMOLED Global",origins:["china","kenya","uae"],specs:{Display:"6.5 90Hz",RAM:"6GB"}},{id:24,name:"iPhone 13 128GB",price:576.92,old:653,brand:"Apple",cat:"Electronics",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400",weight:0.35,desc:"A15 Bionic Factory Unlocked",origins:["usa","japan","uk","china","uae"],specs:{Chip:"A15"}},{id:27,name:"JBL Boombox",price:96.15,old:115,brand:"JBL",cat:"Electronics",img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400",weight:1.2,desc:"Waterproof 24H",origins:["china","usa","germany"]}];
// NOTE: Paste full 50 products from index, add origins array to each like above

let rates={USD:1},cur=localStorage.getItem('userCurrency')||'USD',selectedOrigin='china',selectedMethod='air',dest='ke';
let urlP=new URLSearchParams(location.search);let pid=parseInt(urlP.get('id'))||2;let p=allProducts.find(x=>x.id==pid)||allProducts[0];

function format(usd){let r=rates[cur]||1;let c=usd*r;if(cur=='UGX')return `UGX ${Math.round(c).toLocaleString()}`;if(cur=='NGN')return `₦${Math.round(c).toLocaleString()}`;if(cur=='KES')return `KSh ${Math.round(c).toLocaleString()}`;if(cur=='GBP')return `£${c.toFixed(2)}`;if(cur=='EUR')return `€${c.toFixed(2)}`;return `$${c.toFixed(2)}`;}
function baseCost(o,d,w){let b=BASE_AIR[o]?.[d]||20;let wm=w<=0.5?1:w<=1?1.5:w<=2?2.2:w<=5?3.8:6.5;return b*wm;}

function load(){
let cart=JSON.parse(localStorage.getItem('cart')||'[]');document.getElementById('cartCount').innerText=cart.reduce((s,i)=>s+i.qty,0);
let shipBase=baseCost(selectedOrigin,dest,p.weight);
let originsHtml=p.origins.map(o=>{
let c=baseCost(o,dest,p.weight)*METHOD[selectedMethod].m;
return `<div class="origin-opt ${selectedOrigin==o?'active':''}" onclick="selectedOrigin='${o}';load()"><span><b>${o.toUpperCase()}</b> • Stock: ${o=='kenya'?'Nanyuki':'Overseas'} • ${o=='china'?'Alibaba':o=='japan'?'Tokyo':o=='canada'?'Toronto':o=='usa'?'USA Warehouse':o.toUpperCase()}</span><span>${format(c)} ship</span></div>`;
}).join('');

let methodsHtml=Object.keys(METHOD).map(m=>{
let c=shipBase*METHOD[m].m;
let avail=!(m=='rail' &&!['china','germany','turkey'].includes(selectedOrigin));
return `<div class="ship-opt ${selectedMethod==m?'active':''}" onclick="selectedMethod='${m}';load()" style="${avail?'':'opacity:.4;pointer-events:none'}"><span><b>${m.toUpperCase()}</b> ${METHOD[m].t}</span><span>${format(c)}</span></div>`;
}).join('');

let totalShip=shipBase*METHOD[selectedMethod].m;
let grand=p.price+totalShip;

document.getElementById('prodContainer').innerHTML=`
<div class="card"><img src="${p.img}" style="width:100%;height:360px;object-fit:contain;border:1px solid #eee;border-radius:10px"><p style="font-size:11px;margin-top:8px;color:#64748b">📦 Weight: ${p.weight}kg • ${p.cat}</p></div>
<div class="card">
<span style="background:#0a4a7a;color:#fff;padding:3px 8px;border-radius:20px;font-size:10px">${p.brand}</span> <span style="background:#dcfce7;color:#166534;padding:3px 8px;border-radius:20px;font-size:10px">✅ IN STOCK</span>
<h2 style="margin:8px 0;font-size:18px">${p.name}</h2>
<div style="display:flex;align-items:center;gap:8px"><span class="price">${format(p.price)}</span><s style="color:#94a3b8;font-size:13px">${format(p.old)}</s></div>
<p style="font-size:12px;margin:8px 0">${p.desc}</p>

<div style="margin-top:10px;padding:8px;background:#f8fafc;border-radius:8px">
<label style="font-size:11px;font-weight:900">📍 SHIP TO:</label>
<select id="destSel" onchange="dest=this.value;load()" style="padding:8px;border-radius:8px;border:2px solid #e0f2fe;margin-top:4px">
<option value="ke" ${dest=='ke'?'selected':''}>Kenya</option><option value="ug" ${dest=='ug'?'selected':''}>Uganda</option><option value="ng" ${dest=='ng'?'selected':''}>Nigeria</option><option value="us" ${dest=='us'?'selected':''}>USA</option><option value="ca" ${dest=='ca'?'selected':''}>Canada</option><option value="jp" ${dest=='jp'?'selected':''}>Japan</option><option value="gb" ${dest=='gb'?'selected':''}>UK</option><option value="de" ${dest=='de'?'selected':''}>Germany</option><option value="ae" ${dest=='ae'?'selected':''}>UAE</option>
</select>
</div>

<div style="margin-top:10px"><b style="font-size:11px">🏭 CHOOSE ORIGIN (Seller Warehouse):</b><div style="max-height:180px;overflow:auto">${originsHtml}</div></div>
<div style="margin-top:10px"><b style="font-size:11px">🚚 CHOOSE SHIPPING METHOD:</b><div>${methodsHtml}</div></div>

<div style="margin-top:10px;padding:10px;background:#fff7ed;border-radius:8px;border:1px solid #fed7aa">
<div style="display:flex;justify-content:space-between;font-size:12px"><span>Product</span><span>${format(p.price)}</span></div>
<div style="display:flex;justify-content:space-between;font-size:12px"><span>Shipping ${selectedOrigin.toUpperCase()}→${dest.toUpperCase()} ${selectedMethod.toUpperCase()}</span><span>${format(totalShip)}</span></div>
<div style="display:flex;justify-content:space-between;font-weight:900;font-size:14px;border-top:1px solid #fed7aa;margin-top:6px;padding-top:6px"><span>Total</span><span style="color:#0a4a7a">${format(grand)}</span></div>
</div>

<div style="display:flex;gap:8px;margin-top:10px"><input id="qty" type="number" value="1" min="1" style="width:70px;padding:10px;border:2px solid #e0f2fe;border-radius:8px"></div>
<button class="btn btn-cart" onclick="addCart()">🛒 ADD TO CART - ${format(grand)}</button>
<button class="btn btn-buy" onclick="buyNow()">⚡ BUY NOW</button>
</div>

<div><div class="card"><h4 style="font-size:12px">🚚 Route Info</h4><p style="font-size:11px;margin-top:6px;line-height:1.5">Origin: <b>${selectedOrigin.toUpperCase()}</b><br>To: <b>${dest.toUpperCase()}</b><br>Method: <b>${selectedMethod.toUpperCase()} ${METHOD[selectedMethod].t}</b><br>Weight: ${p.weight}kg<br><br>✅ Air fastest<br>✅ Sea cheapest for >5kg<br>✅ E-parcel budget<br>✅ Rail China↔EU available<br><br>Currency: <select onchange="cur=this.value;localStorage.setItem('userCurrency',cur);location.reload()" style="padding:6px;border-radius:6px"><option ${cur=='USD'?'selected':''} value="USD">USD</option><option ${cur=='UGX'?'selected':''} value="UGX">UGX</option><option ${cur=='NGN'?'selected':''} value="NGN">NGN</option><option ${cur=='KES'?'selected':''} value="KES">KES</option><option ${cur=='GBP'?'selected':''} value="GBP">GBP</option><option ${cur=='EUR'?'selected':''} value="EUR">EUR</option></select></p></div></div>
`;
}

function addCart(){let cart=JSON.parse(localStorage.getItem('cart')||'[]');let qty=parseInt(document.getElementById('qty').value)||1;let ship=baseCost(selectedOrigin,dest,p.weight)*METHOD[selectedMethod].m;let existing=cart.find(x=>x.id==p.id && x.source==selectedOrigin && x.shipMethod==selectedMethod);if(existing){existing.qty+=qty}else{cart.push({id:p.id,name:p.name,price:p.price,priceUSD:p.price,brand:p.brand,image:p.img,img:p.img,qty,weight:p.weight,source:selectedOrigin,shipMethod:selectedMethod,dest,shipCost:ship});}localStorage.setItem('cart',JSON.stringify(cart));localStorage.setItem('userCurrency',cur);alert(`Added ${p.name} from ${selectedOrigin.toUpperCase()} via ${selectedMethod.toUpperCase()} - Total ${format(p.price+ship)}`);document.getElementById('cartCount').innerText=cart.reduce((s,i)=>s+i.qty,0);}
function buyNow(){addCart();location.href='/cart.html';}

async function init(){try{let ip=await fetch('https://ipapi.co/json/').then(r=>r.json());let map={KE:'ke',UG:'ug',NG:'ng',US:'us',CA:'ca',JP:'jp',GB:'gb',DE:'de',AE:'ae'};if(map[ip.country_code])dest=map[ip.country_code];let d=await fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json());rates=d.rates;}catch{}load();}
init();
</script></body></html>
