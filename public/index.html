<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>E-MARTCOM</title>
<style>body{font-family:Arial;background:#f5f5f5;margin:0}header{background:#0a4a7a;padding:12px;color:#fff;display:flex;gap:10px;position:sticky;top:0;z-index:20}.grid{max-width:1350px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:10px}.card{background:#fff;border-radius:10px;padding:8px;text-decoration:none;color:#000;display:block;border:2px solid #eee}.card:hover{border-color:#0a4a7a}.card img{width:100%;height:140px;object-fit:contain}.grand{background:#0a4a7a;color:#fff;padding:6px;border-radius:6px;text-align:center;font-weight:900;margin-top:6px;font-size:12px}</style></head><body>
<header><div style="font-weight:900">E-MARTCOM GLOBAL</div><div style="flex:1"></div><a href="cart.html" style="background:#fff;color:#0a4a7a;padding:6px 12px;border-radius:20px;text-decoration:none;font-weight:900">🛒 <span id="cc">0</span></a></header>
<div style="max-width:1350px;margin:auto;padding:10px"><select id="dest" onchange="localStorage.setItem('shipDest',this.value);render()"><option value="ke">To Kenya</option><option value="ug">Uganda</option><option value="ng">Nigeria</option><option value="us">USA</option><option value="ae">UAE</option><option value="gb">UK</option></select> <select id="method" onchange="localStorage.setItem('shipMethod',this.value);render()"><option value="air">Air 3-7d</option><option value="sea">Sea -65% Cheapest</option><option value="eparcel">E-parcel -35%</option><option value="rail">Rail -45%</option></select></div>
<div class="grid" id="grid"></div>
<script>
const BASE={china:{ke:12,ug:15,ng:18,us:20,ae:16,gb:20},kenya:{ke:1.5,ug:8,ng:15,us:18,ae:15,gb:18},usa:{ke:20,ug:22,ng:24,us:2,ae:16,gb:14},japan:{ke:26,ug:28,ng:30,us:22,ae:18,gb:16},uk:{ke:18,ug:20,ng:22,us:14,ae:12,gb:2},uae:{ke:12,ug:14,ng:16,us:16,ae:2,gb:12},turkey:{ke:14,ug:16,ng:18,us:15,ae:6,gb:8},germany:{ke:18,ug:20,ng:22,us:14,ae:12,gb:6},canada:{ke:24,ug:26,ng:28,us:12,ae:20,gb:14}};
const MM={air:1,sea:0.35,eparcel:0.65,rail:0.55};
let all=[{id:1,n:"Clover Bracelet 18K Gold Variations",p:1.87,old:2.5,w:0.05,o:["china","kenya"],img:"https://images.unsplash.com/photo-1611591437281-460bfbe1220a?w=400",vars:["Gold-purple_LZ0692","Gold-red-LZ0692","Gold-pink-LZ0692","Gold-blue-LZ0692","Gold-orange-LZ0692","Gold-green-LZ0692"]},{id:2,n:"Samsung A15 128GB",p:180.77,old:200,w:0.4,o:["china","kenya","uae"],img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400"},{id:3,n:"Nike T-Shirt 3pcs",p:13.85,old:17,w:0.2,o:["turkey","china","kenya"],img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"}];
let dest=localStorage.getItem('shipDest')||'ke';let method=localStorage.getItem('shipMethod')||'air';
document.getElementById('dest').value=dest;document.getElementById('method').value=method;
function sc(o,d,w){let b=BASE[o]?.[d]||20;let m=w<=0.5?1:w<=1?1.5:w<=2?2.2:w<=5?3.8:6.5;return b*m*MM[method];}
function render(){let h='';all.forEach(pr=>{let c=pr.o.map(o=>sc(o,dest,pr.w)).sort((a,b)=>a-b)[0];let g=pr.p+c;h+=`<a class="card" href="product.html?id=${pr.id}"><img src="${pr.img}"><div style="font-weight:800;font-size:12px">${pr.n.slice(0,35)}</div><div style="font-size:10px;color:#666">From ${pr.o[0].toUpperCase()} → ${dest.toUpperCase()} ${method.toUpperCase()}</div><div style="font-size:10px">Product $${pr.p} + Ship $${c.toFixed(2)}</div><div class="grand">$${g.toFixed(2)} INCLUSIVE • Tap to select variations</div></a>`});document.getElementById('grid').innerHTML=h;document.getElementById('cc').innerText=JSON.parse(localStorage.getItem('cart')||'[]').reduce((s,i)=>s+i.qty,0);}render();
</script></body></html>
