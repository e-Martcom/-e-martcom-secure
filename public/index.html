<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-MARTCOM GLOBAL - FIXED CLICK</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial;background:#f5f5f5;color:#0f172a}header{background:linear-gradient(90deg,#0a4a7a,#0e7490);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;flex-wrap:wrap}.logo{font-weight:900;color:#fff;font-size:22px;cursor:pointer}.search{flex:1;display:flex;max-width:420px}.search input{flex:1;padding:10px;border:none;border-radius:20px 0 0 20px}.search button{border:none;background:#06b6d4;color:#fff;padding:10px 16px;border-radius:0 20px 20px 0;font-weight:900}.filters{max-width:1350px;margin:10px auto;padding:0 10px;display:flex;gap:6px;overflow:auto}.fbtn{padding:7px 12px;border-radius:20px;border:1px solid #e0f2fe;background:#fff;font-size:11px;font-weight:800;cursor:pointer}.fbtn.active{background:#0a4a7a;color:#fff}.wrap{max-width:1350px;margin:8px auto;padding:0 10px;display:grid;grid-template-columns:200px 1fr;gap:10px}.side{background:#fff;border-radius:12px;padding:10px;height:fit-content}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:10px}.card{background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;position:relative}.card img{width:100%;height:140px;object-fit:contain;background:#fff;border-radius:8px}.badge{position:absolute;top:6px;left:6px;background:#f68b1e;color:#fff;font-size:9px;font-weight:800;padding:3px 6px;border-radius:4px}.grand{font-size:11px;font-weight:900;color:#fff;background:linear-gradient(90deg,#0a4a7a,#0e7490);padding:5px 6px;border-radius:6px;margin-top:4px;text-align:center}@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{display:none}}</style></head><body>
<header><div class="logo" onclick="window.location.href='index.html'">E-MART<span style="color:#06b6d4">COM</span> GLOBAL</div>
<div class="search"><input id="q" placeholder="Search..."><button onclick="doSearch()">SEARCH</button></div>
<select id="destTop" onchange="setDest(this.value)"><option value="ke">To: Kenya</option><option value="ug">Uganda</option><option value="ng">Nigeria</option><option value="gh">Ghana</option><option value="za">SA</option><option value="us">USA</option><option value="ca">Canada</option><option value="jp">Japan</option><option value="gb">UK</option><option value="de">Germany</option><option value="ae">UAE</option></select>
<select id="methodTop" onchange="setMethod(this.value)"><option value="air">Air</option><option value="eparcel">E-parcel -35%</option><option value="sea">Sea -65%</option><option value="rail">Rail -45%</option></select>
<div onclick="window.location.href='cart.html'" style="background:#fff;color:#0a4a7a;padding:7px 14px;border-radius:20px;font-weight:900;cursor:pointer">🛒 <span id="cartCount">0</span></div>
</header>
<div class="filters"><button class="fbtn active" onclick="filterO('all',this)">All</button><button class="fbtn" onclick="filterO('china',this)">China</button><button class="fbtn" onclick="filterO('kenya',this)">Kenya</button><button class="fbtn" onclick="filterO('canada',this)">Canada</button><button class="fbtn" onclick="filterO('japan',this)">Japan</button><button class="fbtn" onclick="filterO('usa',this)">USA</button><button class="fbtn" onclick="filterO('germany',this)">Germany</button><button class="fbtn" onclick="filterO('uk',this)">UK</button><button class="fbtn" onclick="filterO('uae',this)">UAE</button><button class="fbtn" onclick="filterO('turkey',this)">Turkey</button></div>
<div class="wrap"><div class="side"><div id="cats"></div></div><div><div class="grid" id="grid"></div></div></div>
<script>
const BASE_AIR={china:{ke:12,ug:15,ng:18,us:20,ca:20,jp:14,gb:20,de:20,ae:16,gh:18,za:18},kenya:{ke:1.5,ug:8,ng:15,us:18,ca:22,jp:24,gb:18,de:18,ae:15,gh:15,za:15},canada:{ke:24,ug:26,ng:28,us:12,ca:2,jp:18,gb:14,de:15,ae:20,gh:28,za:26},japan:{ke:26,ug:28,ng:30,us:22,ca:18,jp:2,gb:16,de:16,ae:18,gh:30,za:28},usa:{ke:20,ug:22,ng:24,us:2,ca:12,jp:22,gb:14,de:14,ae:16,gh:24,za:22},germany:{ke:18,ug:20,ng:22,us:14,ca:15,jp:16,gb:6,de:2,ae:12,gh:22,za:20},uk:{ke:18,ug:20,ng:22,us:14,ca:14,jp:16,gb:2,de:6,ae:12,gh:22,za:20},uae:{ke:12,ug:14,ng:16,us:16,ca:20,jp:18,gb:12,de:12,ae:2,gh:16,za:14},turkey:{ke:14,ug:16,ng:18,us:15,ca:16,jp:17,gb:8,de:7,ae:6,gh:18,za:16}};
const MM={air:1,eparcel:0.65,sea:0.35,rail:0.55};
let allProducts=[{id:1,name:"Nike Cotton T-Shirt Pack 3pcs",price:13.85,old:17,cat:"Apparel",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",weight:0.2,origins:["turkey","china","kenya"]},{id:2,name:"Samsung Galaxy A15 128GB",price:180.77,old:200,cat:"Electronics",img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400",weight:0.4,origins:["china","kenya","uae"]},{id:3,name:"Puma Gym Dumbbells 20kg Pair",price:34.62,old:42,cat:"Sports",img:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400",weight:20,origins:["kenya"]},{id:4,name:"Casio Smart Watch T800",price:19.23,old:26.92,cat:"Watches",img:"https://images.unsplash.com/photo-1555421689-3f034debb7a6?w=400",weight:0.15,origins:["japan","china","usa"]},{id:5,name:"Bata Leather Official Shoes",price:21.54,old:26.92,cat:"Shoes",img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400",weight:0.8,origins:["kenya","turkey","china"]},{id:6,name:"Nunix Sufuria Set 7pcs",price:34.62,old:42,cat:"Home",img:"https://images.unsplash.com/photo-1585837071057-4ea1e5a1b0a4?w=400",weight:3.5,origins:["kenya","china"]},{id:7,name:"Nivea Body Lotion 400ml",price:5,old:6.15,cat:"Beauty",img:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400",weight:0.5,origins:["germany","uk","kenya"]},{id:8,name:"Samsonite School Bag Wheels",price:21.54,old:26.92,cat:"Bags",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400",weight:0.9,origins:["china","usa","germany"]},{id:9,name:"HP Laptop 15 8GB 512GB",price:420,old:500,cat:"Electronics",img:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400",weight:1.8,origins:["usa","china","germany","uae"]},{id:10,name:"Adidas Sneakers Run",price:45,old:60,cat:"Shoes",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400",weight:0.7,origins:["germany","turkey","china","kenya"]},{id:11,name:"Toyota Oil Filter Japan Genuine",price:12,old:18,cat:"Automotive",img:"https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=400",weight:0.3,origins:["japan","uae"]},{id:12,name:"Bosch Drill Machine Germany",price:89,old:110,cat:"Home",img:"https://images.unsplash.com/photo-1504148455328-c376907d081c?w=400",weight:2.2,origins:["germany","uk","china"]},{id:13,name:"UAE Gold Plated Watch Dubai",price:65,old:90,cat:"Watches",img:"https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=400",weight:0.2,origins:["uae","turkey"]},{id:14,name:"UK Dr Martens Boots",price:110,old:140,cat:"Shoes",img:"https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=400",weight:1.1,origins:["uk","germany"]},{id:15,name:"Canada Goose Jacket Winter",price:450,old:550,cat:"Apparel",img:"https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400",weight:0.9,origins:["canada","usa","uk"]},{id:16,name:"iPhone 13 128GB Global",price:576.92,old:653,cat:"Electronics",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400",weight:0.35,origins:["usa","japan","uk","china","canada","uae"]},{id:17,name:"Tecno Camon 20 Pro",price:188.46,old:207,cat:"Electronics",img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400",weight:0.4,origins:["china","kenya","uae"]},{id:18,name:"Sony WH-1000XM4 Headset",price:142.31,old:161,cat:"Electronics",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400",weight:0.5,origins:["japan","usa","china","germany"]},{id:19,name:"JBL Boombox Speaker Waterproof",price:96.15,old:115,cat:"Electronics",img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400",weight:1.2,origins:["china","usa","germany","uae"]},{id:20,name:"Solar Panel 300W China",price:120,old:150,cat:"Home",img:"https://images.unsplash.com/photo-1509391366360-2e959784a276?w=400",weight:12,origins:["china","germany","usa"]}];

let dest=localStorage.getItem('shipDest')||'ke',method=localStorage.getItem('shipMethod')||'air',filterOriginVal='all',q='';
function base(o,d,w){let b=BASE_AIR[o]?.[d]||20;let wm=w<=0.5?1:w<=1?1.5:w<=2?2.2:w<=5?3.8:w<=10?6.5:w<=25?12:w<=100?25:60;return b*wm;}
function goToProduct(id){console.log("Going to product",id); window.location.href='product.html?id='+id; }
function render(){
let grid=document.getElementById('grid');
let filtered=allProducts.filter(p=>{if(filterOriginVal!='all'&&!p.origins.includes(filterOriginVal))return false;if(q&&!p.name.toLowerCase().includes(q.toLowerCase()))return false;return true;});
document.getElementById('cats').innerHTML=[...new Set(allProducts.map(p=>p.cat))].map(c=>`<div style="font-size:11px;padding:4px;cursor:pointer" onclick="q='${c}';render()">${c}</div>`).join('');
grid.innerHTML=filtered.map(p=>{
let costs=p.origins.map(o=>({o,c:base(o,dest,p.weight)*MM[method]}));
let cheapest=costs.reduce((a,b)=>a.c<b.c?a:b);
let grand=p.price+cheapest.c;
return `<div class="card" onclick="goToProduct(${p.id})">
<div class="badge">-${Math.round((1-p.price/p.old)*100)}%</div>
<img src="${p.img}"><div style="font-size:11px;font-weight:800;margin-top:4px">${p.name}</div>
<div style="font-size:9px;color:#64748b">${p.origins.join(', ').toUpperCase()} → ${dest.toUpperCase()} ${method.toUpperCase()}</div>
<div style="font-size:10px">Product $${p.price} + Ship $${cheapest.c.toFixed(2)}</div>
<div class="grand">$${grand.toFixed(2)} INCLUSIVE • ${p.weight}kg</div>
<a href="product.html?id=${p.id}" style="font-size:9px;color:#0a4a7a;display:block;margin-top:4px;text-decoration:underline" onclick="event.stopPropagation()">Open product page →</a>
</div>`;
}).join('');
document.getElementById('cartCount').innerText=JSON.parse(localStorage.getItem('cart')||'[]').reduce((s,i)=>s+i.qty,0);
}
function filterO(o,el){filterOriginVal=o;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
function setDest(d){dest=d;localStorage.setItem('shipDest',d);render();}
function setMethod(m){method=m;localStorage.setItem('shipMethod',m);render();}
function doSearch(){q=document.getElementById('q').value;render();}
render();
</script></body></html>
