<!DOCTYPE html>
<html>
<head>
<title>E-MARTCOM ADMIN 🌊</title>
<style>
body{font-family:Inter, sans-serif; background:#f0f8ff; padding:20px}
.card{background:white; border-radius:16px; padding:20px; box-shadow:0 4px 20px rgba(0,119,182,.1); margin-bottom:20px}
.badge{padding:6px 12px; border-radius:20px; font-weight:700}
.paid{background:#d1fae5; color:#065f46}.failed{background:#fee2e2; color:#991b1b}.pending{background:#fef3c7; color:#92400e}
table{width:100%; border-collapse:collapse} th{ text-align:left; padding:12px; background:#023e8a; color:white} td{padding:12px; border-bottom:1px solid #e5e7eb}
.img{width:50px; height:50px; object-fit:cover; border-radius:8px}
</style>
</head>
<body>
<div class="card"><h1>🌊 E-MARTCOM ADMIN - Oceanic Orders</h1>
<p>TOTAL ORDERS: <b id="total">0</b> | TOTAL SALES (PAID): <b id="sales">KSh 0</b> | <a href="/api/orders/clear" onclick="return confirm('Clear all?')">Clear</a> | <a href="/">Store</a></p>
<p>📲 WhatsApp Alerts go to: 254713367205 - Check Render Logs for link</p>
</div>
<div class="card"><table id="tbl"><tr><th>Image</th><th>Date</th><th>Phone / Card</th><th>Items</th><th>Amount</th><th>Status / Receipt</th><th>Action</th></tr></table></div>
<script>
async function load(){
  const res = await fetch('/api/orders'); const data = await res.json();
  let sales=0;
  document.getElementById('total').innerText=data.orders.length;
  let html='<tr><th>Image</th><th>Date</th><th>Phone / Card</th><th>Items</th><th>Amount</th><th>Status</th><th>WhatsApp</th></tr>';
  data.orders.forEach(o=>{
    if(o.status.includes('PAID')) sales+=parseInt(o.amount);
    const img = o.items?.[0]?.image? `<img class="img" src="${o.items[0].image}">` : '🛒';
    const waMsg = `Hi ${o.phone}, your order ${o.CheckoutRequestID} of KSh ${o.amount} is ${o.status}`;
    html+=`<tr>
      <td>${img}</td>
      <td>${new Date(o.date).toLocaleString()}</td>
      <td>${o.phone}</td>
      <td>${o.itemsText || ''}</td>
      <td><b>KSh ${o.amount}</b></td>
      <td><span class="badge ${o.status.includes('PAID')?'paid':o.status.includes('FAILED')?'failed':'pending'}">${o.status}<br>${o.receipt||''}</span></td>
      <td><a target="_blank" href="https://wa.me/${o.phone.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(waMsg)}">Send WA</a></td>
    </tr>`;
  });
  document.getElementById('tbl').innerHTML=html;
  document.getElementById('sales').innerText='KSh '+sales;
}
load(); setInterval(load,3000);
</script>
</body>
</html>
