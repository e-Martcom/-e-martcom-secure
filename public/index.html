<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-MARTCOM Global - Any Country to Any Country</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial;background:#f5f5f5;color:#0f172a}:root{--ocean:#0a4a7a;--cyan:#06b6d4;--orange:#f68b1e}header{background:linear-gradient(90deg,var(--ocean),#0e7490);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;flex-wrap:wrap}.logo{font-weight:900;color:#fff;font-size:22px;cursor:pointer}.logo span{color:var(--cyan)}.search{flex:1;display:flex;max-width:480px}.search input{flex:1;padding:10px;border:none;border-radius:20px 0 0 20px}.search button{border:none;background:var(--cyan);color:#fff;padding:10px 16px;border-radius:0 20px 20px 0;font-weight:900}.filters{max-width:1350px;margin:10px auto;padding:0 10px;display:flex;gap:6px;overflow:auto;flex-wrap:wrap}.fbtn{padding:7px 12px;border-radius:20px;border:1px solid #e0f2fe;background:#fff;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}.fbtn.active{background:var(--ocean);color:#fff;border-color:var(--ocean)}.wrap{max-width:1350px;margin:8px auto;padding:0 10px;display:grid;grid-template-columns:200px 1fr;gap:10px}.side{background:#fff;border-radius:12px;padding:10px;height:fit-content}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.card{background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;position:relative}.card img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:8px}.badge{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;font-size:9px;font-weight:800;padding:3px 6px;border-radius:4px}.origin-tag{display:inline-block;background:#ecfeff;color:var(--ocean);font-size:8px;font-weight:800;padding:2px 5px;border-radius:10px;margin:2px;border:1px solid #bae6fd}.price{font-weight:900;color:var(--ocean);font-size:14px}.old{font-size:10px;color:#94a3b8;text-decoration:line-through;margin-left:4px}@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{display:none}}</style></head><body>
<header>
<div class="logo" onclick="location.href='/'">E-MART<span>COM</span></div>
<div class="search"><input id="q" placeholder="Search 50 products worldwide..."><button onclick="doSearch()">SEARCH</button></div>
<select id="destTop" onchange="setDest(this.value)" style="padding:8px;border-radius:20px;border:none;font-weight:800;font-size:11px"><option value="ke">Ship to: Kenya</option><option value="ug">Uganda</option><option value="ng">Nigeria</option><option value="gh">Ghana</option><option value="za">South Africa</option><option value="us">USA</option><option value="ca">Canada</option><option value="jp">Japan</option><option value="gb">UK</option><option value="de">Germany/EU</option><option value="ae">UAE</option></select>
<div id="geo" style="color:#fff;font-size:11px;font-weight:800">🌍 Detecting...</div>
<div onclick="location.href='/cart.html'" style="background:#fff;color:var(--ocean);padding:7px 14px;border-radius:20px;font-weight:900;cursor:pointer">🛒 <span id="cartCount">0</span></div>
</header>

<div class="filters">
<button class="fbtn active" onclick="filterOrigin('all')">🌍 All Origins</button>
<button class="fbtn" onclick="filterOrigin('china')">🇨🇳 China</button>
<button class="fbtn" onclick="filterOrigin('kenya')">🇰🇪 Kenya</button>
<button class="fbtn" onclick="filterOrigin('canada')">🇨🇦 Canada</button>
<button class="fbtn" onclick="filterOrigin('japan')">🇯🇵 Japan</button>
<button class="fbtn" onclick="filterOrigin('usa')">🇺🇸 USA</button>
<button class="fbtn" onclick="filterOrigin('germany')">🇩🇪 Germany</button>
<button class="fbtn" onclick="filterOrigin('uk')">🇬🇧 UK</button>
<button class="fbtn" onclick="filterOrigin('uae')">🇦🇪 UAE</button>
<button class="fbtn" onclick="filterOrigin('turkey')">🇹🇷 Turkey</button>
<select id="shipMethodTop" onchange="setMethod(this.value)" style="padding:7px;border-radius:20px;border:2px solid #e0f2fe;font-size:11px;font-weight:800"><option value="air">Air 3-7 days</option><option value="eparcel">E-parcel 10-20d</option><option value="sea">Sea 20-45d cheap</option><option value="rail">Rail 15-25d</option></select>
</div>

<div class="wrap">
<div class="side">
<h4 style="font-size:12px">Categories</h4><div id="cats" style="margin-top:8px"></div>
<h4 style="font-size:12px;margin-top:12px">Ship From Origins</h4>
<div style="font-size:11px;line-height:1.8;margin-top:6px">
🇨🇳 China (Alibaba)<br>🇰🇪 Kenya Nanyuki<br>🇨🇦 Canada Toronto<br>🇯🇵 Japan Tokyo<br>🇺🇸 USA Texas<br>🇩🇪 Germany<br>🇬🇧 UK London<br>🇦🇪 UAE Dubai<br>🇹🇷 Turkey Istanbul
</div>
</div>
<div><div class="grid" id="grid"></div></div>
</div>

<script>
const BASE_AIR={china:{ke:12,ug:15,ng:18,us:20,ca:20,jp:14,gb:20,de:20,ae:16,gh:18,za:18},kenya:{ke:1.5,ug:8,ng:15,us:18,ca:22,jp:24,gb:18,de:18,ae:15,gh:15,za:15},canada:{ke:24,ug:26,ng:28,us:12,ca:2,jp:18,gb:14,de:15,ae:20,gh:28,za:26},japan:{ke:26,ug:28,ng:30,us:22,ca:18,jp:2,gb:16,de:16,ae:18,gh:30,za:28},usa:{ke:20,ug:22,ng:24,us:2,ca:12,jp:22,gb:14,de:14,ae:16,gh:24,za:22},germany:{ke:18,ug:20,ng:22,us:14,ca:15,jp:16,gb:6,de:2,ae:12,gh:22,za:20},uk:{ke:18,ug:20,ng:22,us:14,ca:14,jp:16,gb:2,de:6,ae:12,gh:22,za:20},uae:{ke:12,ug:14,ng:16,us:16,ca:20,jp:18,gb:12,de:12,ae:2,gh:16,za:14},turkey:{ke:14,ug:16,ng:18,us:15,ca:16,jp:17,gb:8,de:7,ae:6,gh:18,za:16}};
const METHOD_M={air:1,eparcel:0.65,sea:0.35,rail:0.55};

let allProducts=[
{id:1,name:"Nike Cotton T-Shirt Pack 3pcs",price:13.85,old:17,cat:"Apparel",brand:"Nike",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",weight:0.2,origins:["china","turkey","kenya"]},
{id:2,name:"Samsung Galaxy A15 128GB",price:180.77,old:200,cat:"Consumer Electronics",brand:"Samsung",img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400",weight:0.4,origins:["china","kenya","uae"]},
{id:3,name:"Puma Dumbbells 20kg Pair",price:34.62,old:42,cat:"Sports",brand:"Puma",img:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400",weight:20,origins:["kenya"]},
{id:4,name:"Casio Smart Watch T800",price:19.23,old:26.92,cat:"Jewellery",brand:"Casio",img:"https://images.unsplash.com/photo-1555421689-3f034debb7a6?w=400",weight:0.15,origins:["japan","china","usa"]},
{id:5,name:"Bata Leather Shoes",price:21.54,old:26.92,cat:"Shoes",brand:"Bata",img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400",weight:0.8,origins:["kenya","turkey"]},
{id:6,name:"Nunix Sufuria Set 7pcs",price:34.62,old:42,cat:"Home",brand:"Nunix",img:"https://images.unsplash.com/photo-1585837071057-4ea1e5a1b0a4?w=400",weight:3.5,origins:["kenya","china"]},
{id:24,name:"iPhone 13 128GB",price:576.92,old:653,cat:"Consumer Electronics",brand:"Apple",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400",weight:0.35,origins:["usa","japan","uk","china","canada"]},
{id:25,name:"Tecno Camon 20 Pro",price:188.46,old:207,cat:"Consumer Electronics",brand:"Tecno",img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400",weight:0.4,origins:["china","kenya"]},
{id:26,name:"Sony WH-1000XM4 Headset",price:142.31,old:161,cat:"Consumer Electronics",brand:"Sony",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400",weight:0.5,origins:["japan","usa","china"]},
{id:27,name:"JBL Boombox Speaker",price:96.15,old:115,cat:"Consumer Electronics",brand:"JBL",img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400",weight:1.2,origins:["china","usa","germany"]},
{id:28,name:"Canada Goose Jacket",price:450,old:550,cat:"Apparel",brand:"Canada Goose",img:"https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400",weight:0.9,origins:["canada","usa"]},
{id:29,name:"Toyota Genuine Oil Filter Japan",price:12,old:18,cat:"Automotive",brand:"Toyota",img:"https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=400",weight:0.3,origins:["japan","uae"]},
{id:30,name:"German Bosch Drill Machine",price:89,old:110,cat:"Home",brand:"Bosch",img:"https://images.unsplash.com/photo-1504148455328-c376907d081c?w=400",weight:2.2,origins:["germany","uk","china"]},
{id:31,name:"UAE Gold Plated Watch",price:65,old:90,cat:"Jewellery",brand:"Dubai Gold",img:"https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=400",weight:0.2,origins:["uae","turkey"]},
{id:32,name:"UK Dr Martens Boots",price:110,old:140,cat:"Shoes",brand:"Dr Martens",img:"https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=400",weight:1.1,origins:["uk","germany"]}
];
// ADD remaining 18 to reach 50 - copy same structure and add origins

let rates={USD:1},cur=localStorage.getItem('userCurrency')||'USD',dest='ke',method='air',filterO='all',q='';
function format(usd){let r=rates[cur]||1;let c=usd*r;if(cur=='UGX')return `UGX ${Math.round(c).toLocaleString()}`;if(cur=='NGN')return `₦${Math.round(c).toLocaleString()}`;if(cur=='KES')return `KSh ${Math.round(c).toLocaleString()}`;if(cur=='GHS')return `GH₵ ${c.toFixed(2)}`;if(cur=='GBP')return `£${c.toFixed(2)}`;if(cur=='EUR')return `€${c.toFixed(2)}`;return `$${c.toFixed(2)}`;}
function base(o,d,w){let b=BASE_AIR[o]?.[d]||20;let wm=w<=0.5?1:w<=1?1.5:w<=2?2.2:w<=5?3.8:6.5;return b*wm;}
function render(){
let grid=document.getElementById('grid');
let filtered=allProducts.filter(p=>{
if(filterO!='all' &&!p.origins.includes(filterO)) return false;
if(q &&!p.name.toLowerCase().includes(q.toLowerCase())) return false;
return true;
});
let cats=[...new Set(allProducts.map(p=>p.cat))];
document.getElementById('cats').innerHTML=cats.map(c=>`<div style="font-size:11px;padding:4px;cursor:pointer" onclick="q='${c}';render()">${c}</div>`).join('');
grid.innerHTML=filtered.map(p=>{
let cheapest=Math.min(...p.origins.map(o=>base(o,dest,p.weight)*METHOD_M[method]));
let cheapestOrigin=p.origins.reduce((best,o)=>{let cost=base(o,dest,p.weight)*METHOD_M[method];return cost<best.cost?{o,cost}:{...best}},{o:p.origins[0],cost:Infinity}).o;
return `<div class="card" onclick="location.href='/product.html?id=${p.id}'">
<div class="badge">-${Math.round((1-p.price/p.old)*100)}%</div>
<img src="${p.img}"><div style="font-size:11px;font-weight:700;margin-top:4px">${p.name.slice(0,32)}</div>
<div style="margin:2px 0">${p.origins.map(o=>`<span class="origin-tag">${o.toUpperCase()}</span>`).join('')}</div>
<div class="price">${format(p.price)} <span class="old">${format(p.old)}</span></div>
<div style="font-size:9px;color:#0a4a7a">🚚 From ${cheapestOrigin.toUpperCase()} → ${dest.toUpperCase()} ${method.toUpperCase()}: ${format(cheapest)}</div>
<div style="font-size:9px;color:#64748b">Total ~${format(p.price+cheapest)} • ${p.weight}kg</div>
</div>`;
}).join('');
document.getElementById('cartCount').innerText=JSON.parse(localStorage.getItem('cart')||'[]').reduce((s,i)=>s+i.qty,0);
}
function filterOrigin(o){filterO=o;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');render();}
function setDest(d){dest=d;render();}
function setMethod(m){method=m;render();}
function doSearch(){q=document.getElementById('q').value;render();}
async function init(){try{let ip=await fetch('https://ipapi.co/json/').then(r=>r.json());let map={KE:'ke',UG:'ug',NG:'ng',GH:'gh',ZA:'za',US:'us',CA:'ca',JP:'jp',GB:'gb',DE:'de',AE:'ae'};if(map[ip.country_code]){dest=map[ip.country_code];document.getElementById('destTop').value=dest;}let mapC={UG:'UGX',NG:'NGN',KE:'KES',GH:'GHS',ZA:'ZAR',GB:'GBP',DE:'EUR',US:'USD',CA:'CAD',JP:'JPY',AE:'AED'};if(!localStorage.getItem('userCurrency'))cur=mapC[ip.country_code]||'USD';let data=await fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json());rates=data.rates;document.getElementById('geo').innerText=`📍 ${ip.country_name} • ${cur} • To:${dest.toUpperCase()}`;}catch{}render();}
init();
</script></body></html>
