<script>
function addToCartAndGo(go){
let totalQty=Object.values(qtys).reduce((s,q)=>s+parseInt(q||0),0);
if(totalQty==0){alert('Select qty first - click + button');return;}
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
Object.keys(qtys).forEach(v=>{
 if(qtys[v]>0){
  let ship=base(origin,dest,pr.w);
  cart.push({
    id:pr.id+'_'+v.replace(/\s/g,'_'),
    name:pr.n+' '+v,
    price:pr.p,
    priceUSD:pr.p,
    p:pr.p,
    qty:parseInt(qtys[v]),
    weight:pr.w,
    w:pr.w,
    source:origin,
    o:origin,
    shipMethod:method,
    dest:dest,
    shipCost:ship,
    variation:v,
    image:pr.img,
    img:pr.img
  });
 }
});
localStorage.setItem('cart',JSON.stringify(cart));
localStorage.setItem('shipDest',dest);
localStorage.setItem('shipMethod',method);
console.log('SAVED CART',cart);
alert('✅ Added '+totalQty+' pcs\nNow Cart has '+cart.reduce((s,i)=>s+i.qty,0)+' items\nGrand '+document.getElementById('grandPay')?.innerText);
if(go){ location.href='cart.html?v='+Date.now(); }
}
</script>
