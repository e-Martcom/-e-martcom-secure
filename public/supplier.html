<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supplier - E-MARTCOM</title>
<style>*{box-sizing:border-box;font-family:Arial}body{background:#eef6fb;padding:12px;margin:0}
.card{background:#fff;max-width:620px;margin:20px auto;padding:24px;border-radius:16px;border:1px solid #e0f2fe}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border:2px solid #e0f2fe;border-radius:10px;font-size:14px;outline:none}
input:focus{border-color:#0a4a7a}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:10px;background:#0a4a7a;color:#fff}
.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;font-size:12px;display:none}
.ok{background:#dcfce7;color:#166534;padding:10px;border-radius:10px;font-size:12px;display:none}
</style></head><body>
<div class="card"><h2 style="color:#0a4a7a">🌊 Supplier Registration</h2>
<input id="sName" placeholder="Company Name *">
<input id="sPhone" placeholder="Phone 07... or 2547... *">
<input id="sEmail" placeholder="Email *">
<select id="sCat"><option value="">Select Category *</option><option>Apparel</option><option>Electronics</option><option>Jewelry</option><option>Home</option><option>Beauty</option><option>All</option></select>
<textarea id="sDesc" placeholder="What do you supply? *"></textarea>
<h3 style="color:#0a4a7a;margin-top:12px">Product *</h3>
<input id="pName" placeholder="Product Name *"><input id="pPrice" type="number" placeholder="Price KSh *"><input id="pStock" type="number" placeholder="Stock *"><input id="pImg" placeholder="Image Link">
<div id="err" class="err"></div><div id="ok" class="ok"></div>
<button class="btn" onclick="registerSupplier()">Register & Add Product 🚀</button></div>
<script>
function norm(p){let x=String(p).replace(/\D/g,''); if(x.startsWith('0'))x='254'+x.slice(1); if(x.startsWith('7'))x='254'+x; return x;}
function valid(){
 let e=document.getElementById('err'); e.style.display='none';
 let sName=sNameEl().trim(), sPh=document.getElementById('sPhone').value.trim(), sEm=document.getElementById('sEmail').value.trim();
 let cat=document.getElementById('sCat').value, desc=document.getElementById('sDesc').value.trim();
 let pN=document.getElementById('pName').value.trim(), pP=document.getElementById('pPrice').value, pS=document.getElementById('pStock').value;
 function sNameEl(){return document.getElementById('sName').value;}
 if(sName.length<3){e.innerText='❌ Company name min 3'; e.style.display='block'; return null;}
 let ph=norm(sPh); if(ph.length<12||!ph.startsWith('254')){e.innerText='❌ Phone must be 07... or 2547...'; e.style.display='block'; return null;}
 if(!sEm.includes('@')){e.innerText='❌ Valid email needed'; e.style.display='block'; return null;}
 if(!cat){e.innerText='❌ Select category'; e.style.display='block'; return null;}
 if(desc.length<10){e.innerText='❌ Describe products min 10 chars'; e.style.display='block'; return null;}
 if(pN.length<3){e.innerText='❌ Product name needed'; e.style.display='block'; return null;}
 if(parseFloat(pP)<=0){e.innerText='❌ Price >0'; e.style.display='block'; return null;}
 if(parseInt(pS)<1){e.innerText='❌ Stock >=1'; e.style.display='block'; return null;}
 return {supplier:{name:sName,phone:ph,email:sEm,category:cat,desc}, product:{name:pN,price:pP,stock:pS,image:document.getElementById('pImg').value.trim()}};
}
async function registerSupplier(){
 let v=valid(); if(!v)return;
 let b=document.querySelector('.btn'); b.innerText='⏳ Sending...'; b.disabled=true;
 try{
  let r=await fetch('/api/supplier/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});
  let j=await r.json();
  if(j.ok){document.getElementById('ok').innerText='✅ Success! Admin approves in 2h'; document.getElementById('ok').style.display='block'; b.innerText='✅ Registered';}
  else{throw new Error(j.error);}
 }catch(e){let er=document.getElementById('err'); er.innerText='❌ '+e.message; er.style.display='block'; b.disabled=false; b.innerText='Register & Add Product 🚀';}
}
</script></body></html>
