<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product - E-MARTCOM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Roboto,Arial}
body{background:#f0f8ff}
.topbar{background:linear-gradient(90deg,#023e8a,#0077b6,#0096c7);color:#fff;display:flex;align-items:center;padding:10px 4%;gap:16px;position:sticky;top:0;z-index:20}
.logo{font-weight:900;font-size:22px;color:#fff}
.search{flex:1;display:flex;background:#fff;border-radius:24px;overflow:hidden;max-width:600px}.search input{flex:1;padding:10px 16px;border:none;outline:none}.search button{background:#023e8a;color:#fff;border:none;padding:10px 20px;font-weight:800;cursor:pointer}
.links{display:flex;gap:18px;color:#fff;font-weight:700;font-size:13px;align-items:center}.links a{color:#fff;text-decoration:none}
.bread{padding:12px 4%;font-size:12px;color:#0077b6}
.main{max-width:1250px;margin:0 auto;padding:0 12px;display:grid;grid-template-columns:1.1fr 1.2fr 0.8fr;gap:12px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 4px 12px rgba(0,119,182,.1);border:1px solid #caf0f8}
.imgMain{width:100%;height:360px;object-fit:contain;border:1px solid #caf0f8;border-radius:12px;background:#fff}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow:auto}.thumbs img{width:56px;height:56px;border:2px solid #caf0f8;border-radius:8px;object-fit:cover;cursor:pointer}.thumbs img.active{border:2px solid #0096c7}
.badge{font-size:10px;background:#caf0f8;color:#0077b6;padding:4px 10px;border-radius:12px;font-weight:800}
.price{font-size:28px;font-weight:900;margin:10px 0;color:#023e8a}.old{font-size:14px;color:#999;text-decoration:line-through;margin-left:10px}
.stock{color:#00b4d8;font-size:12px;font-weight:800}
.btn{width:100%;background:linear-gradient(90deg,#0077b6,#0096c7);color:#fff;border:none;padding:14px;border-radius:24px;font-weight:900;font-size:15px;cursor:pointer;margin-top:12px}
.meta{font-size:12px;color:#555;margin:8px 0;line-height:1.6}
.rightTitle{font-weight:800;font-size:11px;border-bottom:2px solid #caf0f8;padding-bottom:8px;margin-bottom:10px;color:#023e8a}
.select{width:100%;padding:10px;border:1px solid #90e0ef;border-radius:8px;margin:6px 0;background:#f0f8ff}
.infoBox{font-size:12px;line-height:1.8;margin:8px 0}
.sellerBox{background:#fff;border-radius:12px;padding:16px;margin-top:12px;border:1px solid #caf0f8}
.bottomGrid{max-width:1250px;margin:12px auto;padding:0 12px;display:grid;grid-template-columns:2fr 0.8fr;gap:12px}
.section{background:#fff;border-radius:12px;padding:18px;border:1px solid #caf0f8}
.section h3{font-size:15px;border-bottom:2px solid #caf0f8;padding-bottom:10px;margin-bottom:12px;color:#023e8a}
.spec td{padding:10px;border-bottom:1px solid #f0f8ff;font-size:13px}.spec td:first-child{font-weight:700;width:35%;background:#f0f8ff;color:#0077b6}
.stars{color:#00b4d8}
.related{display:flex;gap:10px;overflow:auto}.related div{width:150px;background:#fff;border-radius:12px;padding:10px;text-align:center;border:1px solid #caf0f8}.related img{width:100%;height:80px;object-fit:contain}
@media(max-width:900px){.main{grid-template-columns:1fr}.bottomGrid{grid-template-columns:1fr}}
</style></head><body>
<div class="topbar"><div class="logo" onclick="location.href='/'" style="cursor:pointer">🌊 E-MARTCOM</div>
<div class="search"><input placeholder="Search products"><button>SEARCH</button></div>
<div class="links"><a href="/account.html">👤 Account</a><a href="/">🛒 Cart <span id="cartCount" style="background:#fff;color:#0077b6;border-radius:50%;padding:2px 8px">0</span></a></div></div>
<div class="bread" id="bread"></div>
<div class="main">
<div class="card"><img id="pImg" class="imgMain"><div class="thumbs" id="thumbs"></div></div>
<div class="card"><div id="pBrand" class="badge"></div><h2 id="pName" style="font-size:16px;margin:10px 0;color:#023e8a"></h2><div class="price">KSh <span id="pPrice"></span><span class="old">KSh <span id="pOld"></span></span></div><div class="stock">✔ In Stock - Nanyuki</div><div style="font-size:12px;margin-top:6px"><span class="stars">★★★★★</span> (50 ratings)</div><div class="meta" id="pDesc"></div><button class="btn" onclick="addToCartCurrent()">🛒 ADD TO CART - M-Pesa Secure</button></div>
<div><div class="card"><div class="rightTitle">🌊 DELIVERY & RETURNS</div><select class="select"><option>Nanyuki, Laikipia</option><option>Nairobi</option><option>Mombasa</option></select><div class="infoBox"><b>🚚 Door Delivery</b><br>KSh 100-250<br>1-2 days<br><br><b>📦 Pickup</b><br>KSh 80-150<br>1-2 days</div></div><div class="sellerBox"><div class="rightTitle">SELLER INFORMATION</div><div style="font-weight:700;color:#023e8a" id="sellerName"></div><button style="width:100%;background:linear-gradient(90deg,#0077b6,#0096c7);color:#fff;border:none;padding:10px;border-radius:24px;font-weight:700;margin-top:6px">Follow Store 🌊</button></div></div>
</div>
<div class="bottomGrid"><div><div class="section"><h3>Product details</h3><p id="pDetails" style="font-size:13px;line-height:1.8"></p><h3 style="margin-top:20px">Specifications</h3><table class="spec" style="width:100%;border-collapse:collapse" id="specTable"></table><h3 style="margin-top:20px">Customers also viewed</h3><div class="related" id="related"></div>
<!-- HIDDEN FROM CUSTOMERS - ONLY ADMIN CAN SEE -->
<div id="adminSourcingBox" class="section" style="margin-top:16px;border:2px solid #0096c7;display:none">
<h3>🌊 Global Sourcing - ADMIN ONLY</h3>
<div id="sourcingLinks" style="display:grid;gap:8px"></div>
</div>
</div></div><div><div class="section"><img id="sideImg" style="width:60px;height:60px;object-fit:contain;float:left;margin-right:8px"><b id="sideName"></b><br>KSh <span id="sidePrice"></span><button class="btn" style="margin-top:10px;padding:10px" onclick="addToCartCurrent()">Add to cart</button></div></div></div>
<script>
let allProducts=[{id:1,name:"Nike Cotton T-Shirt Pack",price:1800,old:2200,cat:"Apparel & Accessories",brand:"Nike",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400",desc:"Nike Brand - 100% Cotton Premium"},{id:2,name:"Samsung Galaxy A15 128GB",price:23500,old:26000,cat:"Consumer Electronics",brand:"Samsung",img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400",desc:"Samsung - 6.5 inch AMOLED"},{id:3,name:"Puma Gym Dumbbells 20kg",price:4500,old:5500,cat:"Sports & Entertainment",brand:"Puma",img:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=400",desc:"Puma - Cast Iron Dumbbells"}];
let current=null;
function getId(){let p=new URLSearchParams(location.search);return parseInt(p.get('id'))||2}
function load(){let id=getId();current=allProducts.find(x=>x.id===id)||allProducts[1];document.getElementById('pImg').src=current.img;document.getElementById('pName').innerText=current.name;document.getElementById('pBrand').innerText=current.brand;document.getElementById('pPrice').innerText=current.price;document.getElementById('pOld').innerText=current.old;document.getElementById('pDesc').innerText=current.desc;document.getElementById('pDetails').innerText=current.desc;document.getElementById('bread').innerText=`Home > ${current.cat} > ${current.name}`;document.getElementById('sellerName').innerText=current.brand;document.getElementById('specTable').innerHTML=`<tr><td>Brand</td><td>${current.brand}</td></tr><tr><td>Price</td><td>KSh ${current.price}</td></tr>`;document.getElementById('sideImg').src=current.img;document.getElementById('sideName').innerText=current.name;document.getElementById('sidePrice').innerText=current.price;let thumbs=document.getElementById('thumbs');thumbs.innerHTML=`<img src="${current.img}" class="active">`;let rel=document.getElementById('related');rel.innerHTML=allProducts.map(p=>`<div onclick="location.href='/product.html?id=${p.id}'"><img src="${p.img}"><div style="font-size:11px">${p.name}</div><div style="font-weight:800;color:#023e8a">KSh ${p.price}</div></div>`).join('');let c=JSON.parse(localStorage.getItem('emart_cart')||'[]').reduce((s,i)=>s+i.qty,0);document.getElementById('cartCount').innerText=c;loadGlobalSourcing();}
function loadGlobalSourcing(){
  // --- SECRET: Auto-source in background without showing customers ---
  const q = encodeURIComponent(current.name);
  // Automatically log to your admin - customer doesn't see anything!
  fetch('/api/external-order',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      productId: current.id,
      productName: current.name,
      customerPrice: current.price,
      source: 'auto',
      sourceUrl: `https://www.alibaba.com/trade/search?searchText=${q}`,
      time: new Date()
    })
  }).catch(()=>{});

  // --- Only show box if YOU are admin ---
  const isAdmin = window.location.search.includes('admin=emart2024') || localStorage.getItem('isAdmin') === 'true';
  if(isAdmin){
    document.getElementById('adminSourcingBox').style.display = 'block';
  } else {
    // Customer sees NOTHING - hide completely
    return;
  }
  
  // Rest of your CHECK/SOURCE buttons code here...
  const q=encodeURIComponent(current.name);
  const links=[{name:'Alibaba',url:`https://www.alibaba.com/trade/search?searchText=${q}`,note:`Factory ~KSh ${Math.floor(current.price*0.65)}`},{name:'1688',url:`https://s.1688.com/selloffer/offer_search.htm?keywords=${q}`,note:`Wholesale profit KSh ${Math.floor(current.price*0.45)}`},{name:'Made-in-China',url:`https://www.made-in-china.com/productdirectory?word=${q}`,note:`Verified`},{name:'eBay',url:`https://www.ebay.com/sch/i.html?_nkw=${q}`,note:`USA stock`},{name:'Jumia KE',url:`https://www.jumia.co.ke/catalog/?q=${q}`,note:`Local`}];
  document.getElementById('sourcingLinks').innerHTML=links.map(l=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border:1px solid #caf0f8;border-radius:8px"><div><b style="font-size:13px;color:#023e8a">${l.name}</b><div style="font-size:11px;color:#555">${l.note}</div></div><div><a href="${l.url}" target="_blank" style="background:#023e8a;color:#fff;padding:6px 10px;border-radius:12px;font-size:11px;text-decoration:none;margin-right:6px">CHECK</a><button onclick="sourceOrder('${l.name}','${l.url}')" style="background:#0096c7;color:#fff;border:none;padding:6px 10px;border-radius:12px;font-size:11px">SOURCE</button></div></div>`).join('');
}
function sourceOrder(source,url){alert(`🌊 Sourcing from ${source}\nProfit: KSh ${Math.floor(current.price*0.35)}\nURL: ${url}`);fetch('/api/external-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productName:current.name,source,url})}).catch(()=>{});}
function addToCartCurrent(){let cart=JSON.parse(localStorage.getItem('emart_cart')||'[]');let ex=cart.find(x=>x.id===current.id);if(ex)ex.qty++;else cart.push({id:current.id,name:current.name,price:current.price,image:current.img,qty:1});localStorage.setItem('emart_cart',JSON.stringify(cart));document.getElementById('cartCount').innerText=cart.reduce((s,i)=>s+i.qty,0);let t=document.createElement('div');t.innerText=`🌊 ${current.name} added!`;t.style.cssText="position:fixed;bottom:20px;right:20px;background:#0077b6;color:#fff;padding:12px;border-radius:12px;z-index:9999";document.body.appendChild(t);setTimeout(()=>t.remove(),2000);fetch('/api/external-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productName:current.name,source:'alibaba',url:`https://www.alibaba.com/trade/search?searchText=${encodeURIComponent(current.name)}`})}).catch(()=>{});}
window.onload=load;
</script></body></html>
